[package]
name = "qedty-core"
version = "1.0.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
description = "QEDTY deterministic semantic core reference types"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
arrow-array = "=54.3.1"
arrow-ipc = "=54.3.1"
arrow-schema = "=54.3.1"

[dev-dependencies]
criterion = "=0.5.1"

[[bench]]
name = "core"
harness = false
