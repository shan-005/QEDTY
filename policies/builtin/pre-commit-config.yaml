# ═══════════════════════════════════════════════════════════════════════════════
# Seraph Guard — Pre-commit Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# Install:   pre-commit install
# Run all:   pre-commit run --all-files
# ═══════════════════════════════════════════════════════════════════════════════

minimum_pre_commit_version: "3.5.0"

# ── Built-in Hooks ────────────────────────────────────────────────────────────
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
        args: [--allow-comments]
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: forbid-new-submodules
      - id: mixed-line-ending
        args: [--fix=no]

  # ── Ruff (Lint + Format) ───────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(src|tests)/
      - id: ruff-format
        files: ^(src|tests)/

  # ── Codespell ───────────────────────────────────────────────────────────────
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.0
    hooks:
      - id: codespell
        args: ["--write-changes", "--ignore-words-list=seraph,teh,nd"]
        additional_dependencies: [tomli]

  # ── Vulture (Dead Code) ─────────────────────────────────────────────────────
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.14
    hooks:
      - id: vulture
        args: ["src/seraph", "--min-confidence", "80"]
        pass_filenames: false

  # ── Bandit (Security) ───────────────────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        files: ^src/

  # ── mypy (Type Check) ───────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        args: [--strict, --show-error-codes, --pretty]
        additional_dependencies:
          - pydantic>=2.10.0
          - types-PyYAML>=6.0.0
          - types-aiofiles>=24.1.0
          - types-Jinja2>=2.11.0
          - types-requests>=2.32.0
          - types-click>=7.1.0
        files: ^src/

  # ── Gitleaks (Secret Detection) ─────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
        args: ["--verbose", "--redact"]

  # ── Pyproject Validate ──────────────────────────────────────────────────────
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: '0.26'
    hooks:
      - id: validate-pyproject

  # ── Deptry (Dependency Check) ───────────────────────────────────────────────
  - repo: https://github.com/fpgmaas/deptry
    rev: 0.23.0
    hooks:
      - id: deptry
        args: ["src/seraph"]
        pass_filenames: false
