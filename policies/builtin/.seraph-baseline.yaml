# ═══════════════════════════════════════════════════════════════════════════════
# Seraph Guard — Enforcement Baseline v3.0 (2026 Elite Edition)
# ═══════════════════════════════════════════════════════════════════════════════
# This file defines which findings MUST be fixed before merge/release,
# and establishes the security baseline for the repository.
#
# NEW in v3.0:
#   • Risk-based enforcement (blast radius > threshold = must-fix)
#   • Conformal prediction confidence thresholds
#   • AI-generated code provenance tracking
#   • SLSA compliance level requirements
#   • Branch-protection aware enforcement (main vs feature branches)
#   • Time-decay for suppressed findings (auto-re-open after N days)
# ═══════════════════════════════════════════════════════════════════════════════

enforcement:
  # ── Must-Fix Rules (CI gate will fail if these are found) ────────────────
  must_fix_rules:
    - "no-aws-access-key"
    - "no-aws-secret-key"
    - "no-github-token"
    - "no-private-key-block"
    - "no-stripe-secret-key"
    - "no-terraform-public-s3"
    - "no-terraform-open-sg"
    - "no-k8s-privileged-containers"
    - "no-k8s-host-network"
    - "no-dockerfile-root-user"
    - "no-eval-in-production"
    - "no-sql-string-concatenation"
    - "no-pickle-loads-untrusted"
    - "no-hardcoded-crypto-keys"
    - "no-openai-api-key"
    - "no-anthropic-api-key"
    - "no-gcp-service-account-key"
    - "no-azure-service-principal"
    - "no-connection-string-password"
    - "no-env-file-committed"

  # ── Must-Fix Categories ───────────────────────────────────────────────────
  must_fix_categories:
    - "secret"
    - "vulnerability"

  # ── Must-Fix Severities ───────────────────────────────────────────────────
  must_fix_severities:
    - "critical"
    - "high"

  # ── Risk-Based Enforcement ────────────────────────────────────────────────
  # Findings with blast_radius_score >= threshold are must-fix regardless
  # of severity or category.
  blast_radius_threshold: 0.75

  # ── Conformal Prediction Threshold ────────────────────────────────────────
  # Findings with conformal confidence < threshold require human review
  # even if they pass other criteria.
  conformal_confidence_threshold: 0.85

  # ── Branch-Aware Enforcement ──────────────────────────────────────────────
  branch_policy:
    main:
      must_fix_severities: ["critical", "high", "medium"]
      max_allowed_low: 0
      max_allowed_info: 10
    release/*:
      must_fix_severities: ["critical", "high"]
      max_allowed_medium: 5
    feature/*:
      must_fix_severities: ["critical"]
      max_allowed_high: 3
      max_allowed_medium: 10

  # ── Time-Decay for Suppressions ───────────────────────────────────────────
  # Suppressed findings auto-re-open after N days for re-validation.
  suppression_expiry_days: 90

  # ── SLSA Compliance Requirements ──────────────────────────────────────────
  slsa:
    required_level: 2
    require_provenance: true
    require_signed_artifacts: true

  # ── AI Code Provenance ────────────────────────────────────────────────────
  ai_provenance:
    flag_ai_generated_code: true
    require_ai_attestation: false
    max_ai_generated_ratio: 0.50  # Flag if >50% of changed code is AI-generated