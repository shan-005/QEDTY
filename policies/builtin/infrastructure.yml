# ═══════════════════════════════════════════════════════════════════════════════
# Seraph Guard — Infrastructure & Container Security Policies v3.0 (2026 Elite)
# ═══════════════════════════════════════════════════════════════════════════════
# Coverage: Terraform, OpenTofu, Pulumi, CloudFormation, AWS CDK, Azure Bicep,
#           Kubernetes, Helm, Kustomize, Docker, Docker Compose, Podman,
#           BuildKit, Buildpacks, Nix, Guix, Crossplane, ArgoCD, Flux
#
# NEW in v3.0:
#   • Native HCL2 attribute-value rules with structured evidence
#   • Kubernetes 1.30+ security contexts (seccomp, AppArmor, SELinux, capabilities)
#   • Terraform state & backend security (encryption, locking, OIDC)
#   • Container hardening (distroless, non-root, read-only rootfs, no NEW_PRIVS)
#   • Cloud-native secrets management (external-secrets, Vault, SSM, Key Vault)
#   • Network policies & service mesh (Istio, Cilium, Calico)
#   • SLSA / Sigstore / cosign for image verification
# ═══════════════════════════════════════════════════════════════════════════════

rules:
  # ── Dockerfile / Container Image Rules ─────────────────────────────────────

  - id: dockerfile-non-root-user
    name: Dockerfile must specify a non-root USER
    type: content_not_contains
    pattern: '^\s*USER\s+\d+'
    paths: ["**/Dockerfile", "**/Dockerfile.*", "**/*.dockerfile", "**/Containerfile"]
    severity: high
    confidence: 0.94
    message: >
      Dockerfile does not specify a non-root USER directive. Containers
      running as root increase the blast radius of container escape
      vulnerabilities (CVE-2024-21626, runc escapes).
    fix: >
      Add a non-root user:
      RUN useradd -m -u 1000 appuser
      USER 1000
      Ensure the user ID is fixed (not relying on /etc/passwd inside the image).
    metadata:
      cwe: "CWE-250"
      frameworks: ["docker"]

  - id: dockerfile-no-latest-tag
    name: Dockerfile must not use :latest tag
    type: content_not_contains
    pattern: '^\s*FROM\s+\S+:latest\s*$'
    paths: ["**/Dockerfile", "**/Dockerfile.*", "**/*.dockerfile", "**/Containerfile"]
    severity: medium
    confidence: 0.96
    message: >
      The Dockerfile uses the :latest tag. This makes builds non-reproducible
      and can silently introduce vulnerabilities or breaking changes.
    fix: >
      Pin to a specific digest or version tag:
      FROM python:3.12-slim@sha256:abc123...
      Use Renovate or Dependabot to propose digest updates.
    metadata:
      cwe: "CWE-1104"

  - id: dockerfile-read-only-rootfs
    name: Dockerfile should create read-only root filesystem
    type: content_not_contains
    pattern: '(?i)read_only|readOnlyRootFilesystem|tmpfs|VOLUME\s+\[|VOLUME\s+/tmp'
    paths: ["**/Dockerfile", "**/Dockerfile.*", "**/*.dockerfile"]
    severity: medium
    confidence: 0.80
    message: >
      No evidence of read-only root filesystem configuration. A writable
      rootfs allows attackers to modify system binaries, install backdoors,
      or tamper with application code inside the container.
    fix: >
      Mount a tmpfs for /tmp and make the rootfs read-only at runtime:
      docker run --read-only --tmpfs /tmp:rw,noexec,nosuid,size=100m
      Or use securityContext in Kubernetes.
    metadata:
      cwe: "CWE-276"

  - id: dockerfile-no-secrets-in-env
    name: Dockerfile must not contain secrets in ENV instructions
    type: content_not_contains
    pattern: '(?i)^\s*ENV\s+(API_KEY|SECRET|TOKEN|PASSWORD|PRIVATE_KEY|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY)\s*=\s*[''"'']?[^''"''\s]+'
    paths: ["**/Dockerfile", "**/Dockerfile.*", "**/*.dockerfile"]
    severity: critical
    confidence: 0.98
    message: >
      A secret was detected in a Dockerfile ENV instruction. Secrets in
      Docker layers are permanently baked into the image and can be extracted
      with docker history or dive.
    fix: >
      Use BuildKit secrets (mount at build time) or runtime environment:
      RUN --mount=type=secret,id=api_key cat /run/secrets/api_key
      Or inject at runtime: docker run -e API_KEY=$API_KEY
    metadata:
      cwe: "CWE-798"

  - id: dockerfile-multi-stage-build
    name: Dockerfile should use multi-stage builds
    type: content_not_contains
    pattern: '(?i)^\s*FROM\s+\S+\s+AS\s+\w+'
    paths: ["**/Dockerfile", "**/Dockerfile.*", "**/*.dockerfile"]
    severity: low
    confidence: 0.75
    message: >
      No multi-stage build detected. Multi-stage builds reduce image size,
      attack surface, and secret exposure by separating build and runtime
      environments.
    fix: >
      Use multi-stage builds:
      FROM python:3.12 AS builder
      RUN pip install --user -r requirements.txt
      FROM python:3.12-slim
      COPY --from=builder /root/.local /home/appuser/.local
    metadata:
      cwe: "CWE-1104"

  # ── Kubernetes / Helm Rules (Native YAML AST) ─────────────────────────────

  - id: k8s-no-privileged-containers
    name: Kubernetes pods must not run privileged containers
    type: yaml_attribute_value
    attribute_path: securityContext.privileged
    forbidden_values: [true]
    paths:
      - "**/k8s/**/*.yaml"
      - "**/k8s/**/*.yml"
      - "**/kubernetes/**/*.yaml"
      - "**/kubernetes/**/*.yml"
      - "**/deploy/**/*.yaml"
      - "**/deploy/**/*.yml"
      - "**/helm/**/*.yaml"
      - "**/helm/**/*.yml"
      - "**/charts/**/*.yaml"
    severity: critical
    confidence: 0.98
    message: >
      A privileged container was detected. Privileged containers have full
      access to the host system, effectively disabling all container isolation.
      This is equivalent to root access on the host.
    fix: >
      Remove privileged: true. Use capabilities.add with minimal permissions
      if specific host access is required:
      capabilities:
        add: ["NET_BIND_SERVICE"]
    metadata:
      cwe: "CWE-250"
      frameworks: ["kubernetes"]

  - id: k8s-no-host-network
    name: Kubernetes pods must not use host network
    type: yaml_attribute_value
    attribute_path: spec.hostNetwork
    forbidden_values: [true]
    paths:
      - "**/k8s/**/*.yaml"
      - "**/k8s/**/*.yml"
      - "**/kubernetes/**/*.yaml"
      - "**/kubernetes/**/*.yml"
      - "**/deploy/**/*.yaml"
      - "**/deploy/**/*.yml"
    severity: high
    confidence: 0.97
    message: >
      A pod is configured to use the host network namespace. This bypasses
      Kubernetes network policies, exposes the pod directly to the host,
      and allows traffic sniffing on the host interface.
    fix: >
      Remove hostNetwork: true. Use Services and NetworkPolicies for
      inter-pod communication. If host networking is absolutely required,
      document the security exception and restrict with NetworkPolicies.
    metadata:
      cwe: "CWE-284"
      frameworks: ["kubernetes"]

  - id: k8s-no-host-pid
    name: Kubernetes pods must not use host PID namespace
    type: yaml_attribute_value
    attribute_path: spec.hostPID
    forbidden_values: [true]
    paths:
      - "**/k8s/**/*.yaml"
      - "**/k8s/**/*.yml"
      - "**/kubernetes/**/*.yaml"
      - "**/kubernetes/**/*.yml"
    severity: high
    confidence: 0.97
    message: >
      A pod is configured to use the host PID namespace. This allows the
      container to see and interact with all processes on the host,
      enabling process injection and privilege escalation.
    fix: >
      Remove hostPID: true.
    metadata:
      cwe: "CWE-284"
      frameworks: ["kubernetes"]

  - id: k8s-no-host-ipc
    name: Kubernetes pods must not use host IPC namespace
    type: yaml_attribute_value
    attribute_path: spec.hostIPC
    forbidden_values: [true]
    paths:
      - "**/k8s/**/*.yaml"
      - "**/k8s/**/*.yml"
      - "**/kubernetes/**/*.yaml"
      - "**/kubernetes/**/*.yml"
    severity: high
    confidence: 0.97
    message: >
      A pod is configured to use the host IPC namespace. This allows
      shared memory access with host processes, potentially leaking
      sensitive data or enabling cross-process attacks.
    fix: >
      Remove hostIPC: true.
    metadata:
      cwe: "CWE-284"
      frameworks: ["kubernetes"]

  - id: k8s-run-as-non-root
    name: Kubernetes containers must run as non-root
    type: yaml_attribute_value
    attribute_path: securityContext.runAsNonRoot
    required_value: true
    paths:
      - "**/k8s/**/*.yaml"
      - "**/k8s/**/*.yml"
      - "**/kubernetes/**/*.yaml"
      - "**/kubernetes/**/*.yml"
      - "**/helm/**/*.yaml"
    severity: high
    confidence: 0.94
    message: >
      Container is not configured to run as non-root. Running as root
      inside a container provides a direct path to host compromise if
      a container escape vulnerability is discovered.
    fix: >
      Add securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
    metadata:
      cwe: "CWE-250"
      frameworks: ["kubernetes"]

  - id: k8s-read-only-root-filesystem
    name: Kubernetes containers must use read-only root filesystem
    type: yaml_attribute_value
    attribute_path: securityContext.readOnlyRootFilesystem
    required_value: true
    paths:
      - "**/k8s/**/*.yaml"
      - "**/k8s/**/*.yml"
      - "**/kubernetes/**/*.yaml"
      - "**/kubernetes/**/*.yml"
    severity: medium
    confidence: 0.90
    message: >
      Container does not use a read-only root filesystem. Attackers who
      compromise the container can modify binaries, install backdoors,
      or persist malware across restarts.
    fix: >
      Add securityContext:
        readOnlyRootFilesystem: true
      Mount emptyDir volumes for writable directories:
      volumes:
        - name: tmp
          emptyDir: {}
    metadata:
      cwe: "CWE-276"
      frameworks: ["kubernetes"]

  - id: k8s-drop-all-capabilities
    name: Kubernetes containers must drop ALL capabilities
    type: yaml_attribute_value
    attribute_path: securityContext.capabilities.drop
    required_value: ["ALL"]
    paths:
      - "**/k8s/**/*.yaml"
      - "**/k8s/**/*.yml"
      - "**/kubernetes/**/*.yaml"
      - "**/kubernetes/**/*.yml"
    severity: medium
    confidence: 0.88
    message: >
      Container does not drop all Linux capabilities. Capabilities like
      CAP_SYS_ADMIN, CAP_NET_RAW, and CAP_SYS_PTRACE can be used for
      container escape and network attacks.
    fix: >
      Add securityContext:
        capabilities:
          drop:
            - ALL
          add: []  # Only add specific required capabilities
    metadata:
      cwe: "CWE-250"
      frameworks: ["kubernetes"]

  - id: k8s-seccomp-profile
    name: Kubernetes containers must have seccomp profile
    type: yaml_attribute_value
    attribute_path: securityContext.seccompProfile.type
    required_value: "RuntimeDefault"
    paths:
      - "**/k8s/**/*.yaml"
      - "**/k8s/**/*.yml"
      - "**/kubernetes/**/*.yaml"
      - "**/kubernetes/**/*.yml"
    severity: medium
    confidence: 0.85
    message: >
      No seccomp profile configured. Seccomp (secure computing mode)
      restricts the syscalls a container can make, reducing the kernel
      attack surface significantly.
    fix: >
      Add securityContext:
        seccompProfile:
          type: RuntimeDefault
      For custom profiles, use type: Localhost and provide a profile file.
    metadata:
      cwe: "CWE-284"
      frameworks: ["kubernetes"]

  - id: k8s-no-latest-image-tag
    name: Kubernetes must not use :latest image tag
    type: content_not_contains
    pattern: 'image:.*:latest'
    paths:
      - "**/k8s/**/*.yaml"
      - "**/k8s/**/*.yml"
      - "**/kubernetes/**/*.yaml"
      - "**/kubernetes/**/*.yml"
      - "**/helm/**/*.yaml"
    severity: medium
    confidence: 0.95
    message: >
      A container image uses the :latest tag. This makes deployments
      non-reproducible and can silently roll out vulnerable or broken
      images without audit trail.
    fix: >
      Pin to a specific digest:
      image: myapp:v1.2.3@sha256:abc123...
      Use imagePullPolicy: IfNotPresent to avoid unexpected pulls.
    metadata:
      cwe: "CWE-1104"
      frameworks: ["kubernetes"]

  - id: k8s-resource-limits
    name: Kubernetes containers must define resource limits
    type: content_not_contains
    pattern: '(?i)limits:\s*\n\s+(cpu|memory|ephemeral-storage)'
    paths:
      - "**/k8s/**/*.yaml"
      - "**/k8s/**/*.yml"
      - "**/kubernetes/**/*.yaml"
      - "**/kubernetes/**/*.yml"
    severity: medium
    confidence: 0.85
    message: >
      No resource limits defined for the container. Without limits, a
      compromised or misbehaving container can exhaust node resources,
      causing denial of service for other workloads.
    fix: >
      Add resources:
        limits:
          cpu: "500m"
          memory: "512Mi"
          ephemeral-storage: "1Gi"
        requests:
          cpu: "100m"
          memory: "128Mi"
    metadata:
      cwe: "CWE-770"
      frameworks: ["kubernetes"]

  - id: k8s-network-policy
    name: Kubernetes namespace should have a NetworkPolicy
    type: file_exists
    paths:
      - "**/k8s/**/network-policy*.yaml"
      - "**/k8s/**/networkpolicy*.yaml"
      - "**/kubernetes/**/network-policy*.yaml"
      - "**/kubernetes/**/networkpolicy*.yaml"
    severity: low
    confidence: 0.80
    message: >
      No NetworkPolicy found for the Kubernetes namespace. Without network
      policies, all pods can communicate freely, violating the principle
      of least privilege and allowing lateral movement after compromise.
    fix: >
      Create a default deny-all policy and allow specific traffic:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: { name: default-deny-all }
      spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
    metadata:
      cwe: "CWE-284"
      frameworks: ["kubernetes"]

  - id: k8s-no-default-service-account
    name: Kubernetes pods must not use default service account
    type: yaml_attribute_value
    attribute_path: spec.serviceAccountName
    forbidden_values: ["default"]
    paths:
      - "**/k8s/**/*.yaml"
      - "**/k8s/**/*.yml"
      - "**/kubernetes/**/*.yaml"
      - "**/kubernetes/**/*.yml"
    severity: low
    confidence: 0.85
    message: >
      A pod uses the default service account. The default account typically
      has broad permissions. A dedicated service account with minimal RBAC
      reduces blast radius if the pod is compromised.
    fix: >
      Create a dedicated service account:
      apiVersion: v1
      kind: ServiceAccount
      metadata: { name: myapp-sa }
      Then set serviceAccountName: myapp-sa in the pod spec.
    metadata:
      cwe: "CWE-250"
      frameworks: ["kubernetes"]

  - id: k8s-no-secret-env-var-plaintext
    name: Kubernetes secrets should not be exposed as plaintext env vars
    type: content_not_contains
    pattern: '(?i)value:\s*[''"'']?[^''"''\s]+[''"'']?'
    paths:
      - "**/k8s/**/*.yaml"
      - "**/k8s/**/*.yml"
      - "**/kubernetes/**/*.yaml"
      - "**/kubernetes/**/*.yml"
    severity: high
    confidence: 0.85
    message: >
      A secret value appears to be hardcoded as a plaintext environment
      variable in a Kubernetes manifest. These values are visible in
      etcd, logs, and Git history.
    fix: >
      Use Kubernetes Secrets with valueFrom.secretKeyRef, or better,
      use external-secrets operator with a secrets manager (Vault, AWS SM).
    metadata:
      cwe: "CWE-798"
      frameworks: ["kubernetes"]

  # ── Terraform / OpenTofu Rules (Native HCL2 AST) ──────────────────────────

  - id: tf-s3-no-public-acl
    name: Terraform S3 buckets must not have public ACLs
    type: hcl_attribute_value
    resource_type: aws_s3_bucket
    attribute: acl
    forbidden_values: ["public-read", "public-read-write", "authenticated-read", "website"]
    paths: ["**/*.tf"]
    severity: critical
    confidence: 0.97
    message: >
      An S3 bucket is configured with a public ACL. This exposes bucket
      contents to the internet, potentially leaking sensitive data or
      enabling data exfiltration.
    fix: >
      Remove the acl attribute or set it to "private". Enable S3 Block
      Public Access:
      resource "aws_s3_bucket_public_access_block" "example" {
        bucket = aws_s3_bucket.example.id
        block_public_acls       = true
        block_public_policy     = true
        ignore_public_acls      = true
        restrict_public_buckets = true
      }
    metadata:
      cwe: "CWE-284"
      frameworks: ["terraform"]

  - id: tf-s3-versioning-enabled
    name: Terraform S3 buckets must have versioning enabled
    type: hcl_attribute_value
    resource_type: aws_s3_bucket_versioning
    attribute: enabled
    required_value: true
    paths: ["**/*.tf"]
    severity: medium
    confidence: 0.90
    message: >
      S3 bucket versioning is not enabled. Without versioning, accidental
      or malicious deletion of objects is irreversible. Ransomware can
      permanently destroy data.
    fix: >
      Add aws_s3_bucket_versioning:
      resource "aws_s3_bucket_versioning" "example" {
        bucket = aws_s3_bucket.example.id
        versioning_configuration { status = "Enabled" }
      }
    metadata:
      cwe: "CWE-693"
      frameworks: ["terraform"]

  - id: tf-sg-no-open-ingress
    name: Terraform security groups must not allow 0.0.0.0/0
    type: hcl_attribute_value
    resource_type: aws_security_group_rule
    attribute: cidr_blocks
    forbidden_values: [["0.0.0.0/0"]]
    paths: ["**/*.tf"]
    severity: critical
    confidence: 0.97
    message: >
      A security group rule allows inbound traffic from 0.0.0.0/0 (the
      entire internet). This exposes the resource to global attack surface
      and is the leading cause of cloud data breaches.
    fix: >
      Restrict cidr_blocks to specific IP ranges or use security group
      references for inter-service communication:
      cidr_blocks = ["10.0.0.0/8"]
      # Or use source_security_group_id
    metadata:
      cwe: "CWE-284"
      frameworks: ["terraform"]

  - id: tf-rds-encryption
    name: Terraform RDS instances must be encrypted
    type: hcl_attribute_value
    resource_type: aws_db_instance
    attribute: storage_encrypted
    required_value: true
    paths: ["**/*.tf"]
    severity: high
    confidence: 0.95
    message: >
      RDS instance is not configured with storage encryption. Data at rest
      will be stored in plaintext, violating compliance requirements (GDPR,
      HIPAA, PCI-DSS) and exposing data if snapshots are leaked.
    fix: >
      Add storage_encrypted = true. Use a customer-managed KMS key for
      additional control:
      storage_encrypted = true
      kms_key_id = aws_kms_key.database.arn
    metadata:
      cwe: "CWE-311"
      frameworks: ["terraform"]

  - id: tf-ebs-encryption
    name: Terraform EBS volumes must be encrypted
    type: hcl_attribute_value
    resource_type: aws_ebs_volume
    attribute: encrypted
    required_value: true
    paths: ["**/*.tf"]
    severity: high
    confidence: 0.95
    message: >
      EBS volume is not encrypted. Unencrypted EBS volumes expose data
      if the underlying physical storage is accessed or if snapshots
      are shared accidentally.
    fix: >
      Add encrypted = true and specify a KMS key:
      encrypted = true
      kms_key_id = aws_kms_key.ebs.arn
    metadata:
      cwe: "CWE-311"
      frameworks: ["terraform"]

  - id: tf-s3-server-side-encryption
    name: Terraform S3 buckets must have default encryption
    type: hcl_attribute_value
    resource_type: aws_s3_bucket_server_side_encryption_configuration
    attribute: apply_server_side_encryption_by_default
    paths: ["**/*.tf"]
    severity: medium
    confidence: 0.90
    message: >
      S3 bucket does not have default server-side encryption configured.
      Objects uploaded without explicit encryption headers will be stored
      in plaintext.
    fix: >
      Add aws_s3_bucket_server_side_encryption_configuration:
      resource "aws_s3_bucket_server_side_encryption_configuration" "example" {
        bucket = aws_s3_bucket.example.id
        rule {
          apply_server_side_encryption_by_default { sse_algorithm = "AES256" }
        }
      }
    metadata:
      cwe: "CWE-311"
      frameworks: ["terraform"]

  - id: tf-iam-no-wildcard-actions
    name: Terraform IAM policies must not use wildcard actions
    type: content_not_contains
    pattern: 'Action\s*=\s*[''"'']?\*[''"'']?'
    paths: ["**/*.tf"]
    severity: high
    confidence: 0.95
    message: >
      IAM policy uses Action = "*" (full admin access). This violates
      the principle of least privilege and grants the principal unlimited
      permissions across all AWS services.
    fix: >
      Replace with specific actions:
      Action = [
        "s3:GetObject",
        "s3:PutObject",
        "s3:ListBucket"
      ]
    metadata:
      cwe: "CWE-250"
      frameworks: ["terraform"]

  - id: tf-state-encryption
    name: Terraform state must be encrypted
    type: content_not_contains
    pattern: '(?i)encrypt\s*=\s*true'
    paths: ["**/*.tf"]
    severity: high
    confidence: 0.85
    message: >
      No evidence of Terraform state encryption. Terraform state files
      contain sensitive values (passwords, keys, tokens). Unencrypted
      state in S3 or local storage is a critical secret exposure risk.
    fix: >
      Enable state encryption in backend configuration:
      terraform {
        backend "s3" {
          bucket         = "my-terraform-state"
          key            = "prod/terraform.tfstate"
          region         = "us-east-1"
          encrypt        = true
          kms_key_id     = "arn:aws:kms:..."
          dynamodb_table = "terraform-locks"
        }
      }
    metadata:
      cwe: "CWE-311"
      frameworks: ["terraform"]

  - id: tf-oidc-for-ci-cd
    name: Terraform CI/CD should use OIDC instead of long-lived credentials
    type: content_not_contains
    pattern: '(?i)access_key|secret_key'
    paths: ["**/*.tf"]
    severity: medium
    confidence: 0.80
    message: >
      Long-lived AWS access keys detected in Terraform configuration.
      OIDC (OpenID Connect) federation for CI/CD eliminates the need for
      static credentials and reduces credential rotation burden.
    fix: >
      Use OIDC provider for GitHub Actions / GitLab CI:
      resource "aws_iam_openid_connect_provider" "github" {
        url = "https://token.actions.githubusercontent.com"
        client_id_list = ["sts.amazonaws.com"]
        thumbprint_list = ["6938fd4e98bab03faadb97b34396831e3780aea1"]
      }
    metadata:
      cwe: "CWE-798"
      frameworks: ["terraform"]

  # ── Docker Compose Rules ──────────────────────────────────────────────────

  - id: compose-no-privileged
    name: Docker Compose must not use privileged mode
    type: yaml_attribute_value
    attribute_path: privileged
    forbidden_values: [true]
    paths:
      - "**/docker-compose*.yml"
      - "**/docker-compose*.yaml"
      - "**/compose*.yml"
      - "**/compose*.yaml"
    severity: high
    confidence: 0.95
    message: >
      A Docker Compose service is running in privileged mode. This grants
      the container full access to the host, equivalent to root.
    fix: >
      Remove privileged: true. Use cap_add with minimal capabilities:
      cap_add:
        - NET_BIND_SERVICE
    metadata:
      cwe: "CWE-250"
      frameworks: ["docker-compose"]

  - id: compose-no-root-user
    name: Docker Compose services must not run as root
    type: content_not_contains
    pattern: '(?i)user:\s*[''"'']?0[''"'']?|user:\s*[''"'']?root[''"'']?'
    paths:
      - "**/docker-compose*.yml"
      - "**/docker-compose*.yaml"
      - "**/compose*.yml"
      - "**/compose*.yaml"
    severity: high
    confidence: 0.94
    message: >
      A Docker Compose service is configured to run as root (user: 0 or
      user: root). This increases the blast radius of container escapes.
    fix: >
      Set user: "1000:1000" or use a named user defined in the Dockerfile.
    metadata:
      cwe: "CWE-250"
      frameworks: ["docker-compose"]
