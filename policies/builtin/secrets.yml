# ═══════════════════════════════════════════════════════════════════════════════
# Seraph Guard — Secret Detection Policies v3.0 (2026 Elite Edition)
# ═══════════════════════════════════════════════════════════════════════════════
# Coverage: Cloud providers (AWS, GCP, Azure, IBM, Oracle, DigitalOcean),
#           SaaS platforms (GitHub, GitLab, Slack, Stripe, Twilio, SendGrid),
#           AI/LLM providers (OpenAI, Anthropic, Google AI, Cohere, Mistral),
#           Database credentials, JWT, API keys, SSH keys, certificates,
#           Cryptocurrency wallets, OAuth tokens, SAML keys, PII patterns
#
# NEW in v3.0:
#   • AI/LLM API key detection (OpenAI, Anthropic, Gemini, Cohere, Mistral, Replicate)
#   • GitHub Fine-Grained PATs (2024+ format)
#   • npm granular access tokens (npm_ prefix)
#   • Docker registry tokens, Kubernetes service account tokens
#   • Base64-encoded secret detection (double-pass entropy analysis)
#   • GitHub Actions OIDC tokens, CircleCI tokens, Travis CI tokens
#   • Terraform Cloud / Enterprise tokens
#   • 1Password, Bitwarden, LastPass service account tokens
#   • Improved entropy thresholds to reduce false positives
# ═══════════════════════════════════════════════════════════════════════════════

rules:
  # ─────────────────────────────────────────────
  # CLOUD PROVIDER CREDENTIALS
  # ─────────────────────────────────────────────

  - id: no-aws-access-key
    name: No hardcoded AWS Access Key IDs
    type: content_not_contains
    pattern: '\bAKIA[0-9A-Z]{16}\b'
    paths:
      - "src/**/*"
      - "config/**/*"
      - "scripts/**/*"
      - "**/*.env"
      - "**/*.env.*"
    severity: critical
    confidence: 0.99
    message: >
      Hardcoded AWS Access Key ID detected. AWS keys in source code are the
      number one cause of cloud data breaches. If valid, an attacker gains
      full programmatic access to your AWS account.
    fix: >
      Remove the key immediately. Rotate it in the AWS IAM console.
      Use IAM roles for EC2/EKS/Lambda, or AWS Secrets Manager.
      For local dev, use AWS SSO or aws-vault.
    metadata:
      cwe: "CWE-798"
      category: "cloud-credentials"
      provider: "aws"

  - id: no-aws-secret-key
    name: No hardcoded AWS Secret Access Keys
    type: content_not_contains
    pattern: '(?i)aws_secret_access_key\s*[:=]\s*[''"]?[A-Za-z0-9/+=]{40}'
    paths:
      - "src/**/*"
      - "config/**/*"
      - "**/*.env"
      - "**/*.env.*"
    severity: critical
    confidence: 0.98
    message: >
      Hardcoded AWS Secret Access Key detected. Combined with an Access Key ID,
      this grants full programmatic access to your AWS account.
    fix: >
      Remove the secret key. Rotate credentials in AWS IAM.
      Use IAM roles or AWS Secrets Manager / SSM Parameter Store.
    metadata:
      cwe: "CWE-798"
      category: "cloud-credentials"
      provider: "aws"

  - id: no-aws-session-token
    name: No hardcoded AWS Session Tokens
    type: content_not_contains
    pattern: '(?i)aws_session_token\s*[:=]\s*[''"'']?[A-Za-z0-9/+=]{100,}[''"'']?'
    paths:
      - "src/**/*"
      - "config/**/*"
      - "**/*.env"
    severity: critical
    confidence: 0.97
    message: >
      AWS session token detected. Session tokens are temporary but still
      grant access for their duration. If combined with access key + secret,
      full account access is possible.
    fix: >
      Use IAM roles with STS AssumeRole. Never hardcode session tokens.
    metadata:
      cwe: "CWE-798"
      provider: "aws"

  - id: no-gcp-service-account-key
    name: No hardcoded GCP Service Account keys
    type: content_not_contains
    pattern: '"type":\s*"service_account"|AIza[0-9A-Za-z_-]{35}'
    paths:
      - "src/**/*"
      - "config/**/*"
      - "**/*.json"
      - "**/*.env"
    severity: critical
    confidence: 0.97
    message: >
      GCP service account key or API key detected. Service account keys
      grant broad access to GCP resources and are a primary attack vector
      for cloud compromise.
    fix: >
      Use Workload Identity Federation instead of service account keys.
      If a key is necessary, store it in Secret Manager and rotate quarterly.
    metadata:
      cwe: "CWE-798"
      provider: "gcp"

  - id: no-azure-service-principal
    name: No hardcoded Azure Service Principal credentials
    type: content_not_contains
    pattern: '(?i)azure_client_id|azure_tenant_id|azure_client_secret|AZURE_CLIENT_SECRET'
    paths:
      - "src/**/*"
      - "config/**/*"
      - "**/*.env"
      - "**/*.yaml"
    severity: critical
    confidence: 0.96
    message: >
      Azure Service Principal credentials detected. These credentials grant
      access to Azure AD and Azure resources. Exposure can lead to full
      tenant compromise.
    fix: >
      Use Managed Identity (System-assigned or User-assigned) instead of
      Service Principal secrets. For CI/CD, use workload identity federation.
    metadata:
      cwe: "CWE-798"
      provider: "azure"

  - id: no-ibm-cloud-api-key
    name: No hardcoded IBM Cloud API keys
    type: content_not_contains
    pattern: '(?i)ibm_cloud_api_key|ic_api_key|IBM_CLOUD_API_KEY'
    paths:
      - "src/**/*"
      - "**/*.env"
      - "**/*.yaml"
    severity: critical
    confidence: 0.95
    message: >
      IBM Cloud API key detected. These keys grant access to IBM Cloud
      services and resources.
    fix: >
      Use IBM Cloud IAM service IDs with API keys stored in Secrets Manager.
      Rotate exposed keys immediately.
    metadata:
      cwe: "CWE-798"
      provider: "ibm"

  - id: no-digitalocean-token
    name: No hardcoded DigitalOcean tokens
    type: content_not_contains
    pattern: 'dop_v1_[a-f0-9]{64}|doo_v1_[a-f0-9]{64}|dor_v1_[a-f0-9]{64}'
    paths:
      - "src/**/*"
      - "**/*.env"
    severity: critical
    confidence: 0.96
    message: >
      DigitalOcean personal access token or OAuth token detected. These
      tokens grant access to Droplets, Spaces, and Kubernetes clusters.
    fix: >
      Use DigitalOcean API tokens stored in environment variables.
      Rotate exposed tokens immediately.
    metadata:
      cwe: "CWE-798"
      provider: "digitalocean"

  # ─────────────────────────────────────────────
  # AI / LLM PROVIDER API KEYS
  # ─────────────────────────────────────────────

  - id: no-openai-api-key
    name: No hardcoded OpenAI API keys
    type: content_not_contains
    pattern: '\bsk-[a-zA-Z0-9]{20,48}\b|\bproj-[a-zA-Z0-9]{20,48}\b'
    paths:
      - "src/**/*"
      - "**/*.env"
      - "**/*.yaml"
      - "**/*.json"
      - "notebooks/**/*.ipynb"
    severity: critical
    confidence: 0.95
    message: >
      OpenAI API key detected. These keys are billed per usage and can
      incur significant costs if stolen. Attackers may use them for
      cryptomining, spam generation, or data exfiltration via model prompts.
    fix: >
      Use environment variables or a secrets manager. Enable usage limits
      and monitoring in the OpenAI dashboard. Rotate the key immediately.
    metadata:
      cwe: "CWE-798"
      category: "ai-credentials"
      provider: "openai"

  - id: no-anthropic-api-key
    name: No hardcoded Anthropic API keys
    type: content_not_contains
    pattern: '\bsk-ant-[a-zA-Z0-9]{32,48}\b'
    paths:
      - "src/**/*"
      - "**/*.env"
      - "**/*.yaml"
      - "notebooks/**/*.ipynb"
    severity: critical
    confidence: 0.96
    message: >
      Anthropic API key detected. Anthropic keys grant access to Claude
      models and are billed per token usage.
    fix: >
      Store in environment variables or a secrets manager. Set rate limits
      and usage alerts. Rotate exposed keys.
    metadata:
      cwe: "CWE-798"
      category: "ai-credentials"
      provider: "anthropic"

  - id: no-google-ai-api-key
    name: No hardcoded Google AI / Gemini API keys
    type: content_not_contains
    pattern: '\bAIza[0-9A-Za-z_-]{35}\b'
    paths:
      - "src/**/*"
      - "**/*.env"
      - "**/*.yaml"
      - "notebooks/**/*.ipynb"
    severity: critical
    confidence: 0.95
    message: >
      Google AI / Gemini API key detected. These keys grant access to
      Google AI services and are tied to your GCP billing account.
    fix: >
      Use Application Default Credentials (ADC) or Workload Identity.
      For API keys, restrict them to specific APIs and IP ranges in
      the Google Cloud Console.
    metadata:
      cwe: "CWE-798"
      category: "ai-credentials"
      provider: "google"

  - id: no-cohere-api-key
    name: No hardcoded Cohere API keys
    type: content_not_contains
    pattern: '(?i)cohere_api_key|COHERE_API_KEY'
    paths:
      - "src/**/*"
      - "**/*.env"
      - "notebooks/**/*.ipynb"
    severity: high
    confidence: 0.90
    message: >
      Cohere API key detected. Cohere keys grant access to embedding and
      generation models.
    fix: >
      Store in environment variables. Rotate exposed keys.
    metadata:
      cwe: "CWE-798"
      category: "ai-credentials"
      provider: "cohere"

  - id: no-huggingface-token
    name: No hardcoded Hugging Face tokens
    type: content_not_contains
    pattern: '\bhf_[a-zA-Z0-9]{20,40}\b'
    paths:
      - "src/**/*"
      - "**/*.env"
      - "notebooks/**/*.ipynb"
    severity: high
    confidence: 0.94
    message: >
      Hugging Face token detected. These tokens grant access to private
      models, datasets, and spaces. They can also be used to upload
      malicious models to your organization.
    fix: >
      Use huggingface-cli login with cached credentials. For CI/CD, use
      HF_TOKEN environment variable. Rotate exposed tokens.
    metadata:
      cwe: "CWE-798"
      category: "ai-credentials"
      provider: "huggingface"

  - id: no-replicate-api-token
    name: No hardcoded Replicate API tokens
    type: content_not_contains
    pattern: '(?i)replicate_api_token|REPLICATE_API_TOKEN'
    paths:
      - "src/**/*"
      - "**/*.env"
    severity: high
    confidence: 0.90
    message: >
      Replicate API token detected. Replicate tokens grant access to
      model inference endpoints and can incur significant compute costs.
    fix: >
      Store in environment variables. Set billing limits and alerts.
    metadata:
      cwe: "CWE-798"
      category: "ai-credentials"
      provider: "replicate"

  # ─────────────────────────────────────────────
  # VERSION CONTROL & CI/CD TOKENS
  # ─────────────────────────────────────────────

  - id: no-github-token
    name: No hardcoded GitHub tokens
    type: content_not_contains
    pattern: '\bgh[pousr]_[A-Za-z0-9_]{36,255}\b|\bghu_[A-Za-z0-9_]{36,255}\b|\bghs_[A-Za-z0-9_]{36}\b'
    paths:
      - "src/**/*"
      - "**/*.env"
      - "**/*.yaml"
      - "**/*.json"
      - "**/*.sh"
    severity: critical
    confidence: 0.98
    message: >
      Hardcoded GitHub token detected. GitHub tokens can access repositories,
      modify code, steal secrets, tamper with CI/CD pipelines, and access
      organization settings. Fine-grained PATs (ghp_*) are scoped but still
      dangerous if exposed.
    fix: >
      Revoke the token immediately at github.com/settings/tokens.
      Use GITHUB_TOKEN (auto-generated in Actions) or a secrets manager.
      For CI/CD, use OIDC federation instead of long-lived PATs.
    metadata:
      cwe: "CWE-798"
      category: "vcs-credentials"
      provider: "github"

  - id: no-github-oauth-app-secret
    name: No hardcoded GitHub OAuth App secrets
    type: content_not_contains
    pattern: '(?i)github_client_secret|GITHUB_CLIENT_SECRET'
    paths:
      - "src/**/*"
      - "**/*.env"
      - "**/*.yaml"
    severity: critical
    confidence: 0.95
    message: >
      GitHub OAuth App client secret detected. This secret is used to
      authenticate your OAuth app and can be used to impersonate it.
    fix: >
      Rotate the secret in GitHub Developer Settings. Store in a secrets
      manager. Use GitHub Apps instead of OAuth Apps where possible.
    metadata:
      cwe: "CWE-798"
      provider: "github"

  - id: no-gitlab-token
    name: No hardcoded GitLab tokens
    type: content_not_contains
    pattern: '\bglpat-[a-zA-Z0-9_-]{20}\b|\bgldt-[a-zA-Z0-9_-]{20}\b'
    paths:
      - "src/**/*"
      - "**/*.env"
      - "**/*.yaml"
    severity: critical
    confidence: 0.96
    message: >
      GitLab personal or deploy token detected. These tokens grant access
      to repositories, CI/CD variables, and runner configurations.
    fix: >
      Revoke the token in GitLab User Settings. Use CI/CD job tokens
      (CI_JOB_TOKEN) or OIDC for cross-project access.
    metadata:
      cwe: "CWE-798"
      category: "vcs-credentials"
      provider: "gitlab"

  - id: no-circleci-token
    name: No hardcoded CircleCI API tokens
    type: content_not_contains
    pattern: '(?i)circleci_token|CIRCLECI_API_TOKEN|CIRCLE_TOKEN'
    paths:
      - "src/**/*"
      - "**/*.env"
      - "**/*.yaml"
    severity: high
    confidence: 0.92
    message: >
      CircleCI API token detected. These tokens can trigger builds,
      access project settings, and read environment variables.
    fix: >
      Use CircleCI contexts and project-level environment variables.
      Rotate exposed tokens.
    metadata:
      cwe: "CWE-798"
      provider: "circleci"

  - id: no-travis-token
    name: No hardcoded Travis CI tokens
    type: content_not_contains
    pattern: '(?i)travis_token|TRAVIS_API_TOKEN|TRAVIS_TOKEN'
    paths:
      - "src/**/*"
      - "**/*.env"
    severity: high
    confidence: 0.90
    message: >
      Travis CI token detected. These tokens can access build logs,
      environment variables, and trigger builds.
    fix: >
      Store in Travis repository settings (encrypted). Rotate exposed tokens.
    metadata:
      cwe: "CWE-798"
      provider: "travis"

  # ─────────────────────────────────────────────
  # SaaS PLATFORM TOKENS
  # ─────────────────────────────────────────────

  - id: no-slack-token
    name: No hardcoded Slack tokens
    type: content_not_contains
    pattern: '\bxox[baprs]-[A-Za-z0-9\-]{10,}\b'
    paths:
      - "src/**/*"
      - "**/*.env"
      - "**/*.yaml"
      - "**/*.json"
    severity: high
    confidence: 0.96
    message: >
      Hardcoded Slack token detected. Slack tokens can read messages,
      access files, impersonate users, and exfiltrate workspace data.
    fix: >
      Revoke the token in Slack API dashboard. Use Bolt for Python/JS
      with OAuth instead of hardcoded tokens. Rotate exposed tokens.
    metadata:
      cwe: "CWE-798"
      provider: "slack"

  - id: no-stripe-secret-key
    name: No hardcoded Stripe secret keys
    type: content_not_contains
    pattern: '\bsk_(live|test)_[A-Za-z0-9]{24,}\b'
    paths:
      - "src/**/*"
      - "**/*.env"
      - "**/*.yaml"
    severity: critical
    confidence: 0.98
    message: >
      Hardcoded Stripe secret key detected. Stripe secret keys grant full
      access to payment processing, customer data, refunds, and financial
      operations. Exposure can lead to massive fraud and PCI-DSS violations.
    fix: >
      Remove the key. Roll it in the Stripe Dashboard immediately.
      Use Stripe restricted keys with minimal permissions.
      Store in environment variables or a secrets manager.
    metadata:
      cwe: "CWE-798"
      provider: "stripe"

  - id: no-stripe-publishable-key
    name: No hardcoded Stripe publishable keys (informational)
    type: content_not_contains
    pattern: '\bpk_(live|test)_[A-Za-z0-9]{24,}\b'
    paths:
      - "src/**/*"
      - "**/*.env"
    severity: info
    confidence: 0.90
    message: >
      Stripe publishable key detected. Publishable keys are safe to embed
      in client-side code, but should not be in server-side secrets files.
    fix: >
      Ensure this key is used only in frontend/client code. If found in
      server config, move to the frontend build.
    metadata:
      cwe: "CWE-200"
      provider: "stripe"

  - id: no-twilio-api-key
    name: No hardcoded Twilio API keys
    type: content_not_contains
    pattern: '(?i)twilio_account_sid|twilio_auth_token|TWILIO_AUTH_TOKEN'
    paths:
      - "src/**/*"
      - "**/*.env"
      - "**/*.yaml"
    severity: high
    confidence: 0.93
    message: >
      Twilio API credentials detected. These can be used to send SMS,
      make phone calls, and access account data. Attackers may use them
      for SMS pumping fraud or social engineering.
    fix: >
      Use Twilio API keys (not auth tokens) with restricted permissions.
      Store in environment variables. Rotate exposed credentials.
    metadata:
      cwe: "CWE-798"
      provider: "twilio"

  - id: no-sendgrid-api-key
    name: No hardcoded SendGrid API keys
    type: content_not_contains
    pattern: '\bSG\.[a-zA-Z0-9_-]{22}\.[a-zA-Z0-9_-]{43}\b'
    paths:
      - "src/**/*"
      - "**/*.env"
      - "**/*.yaml"
    severity: high
    confidence: 0.95
    message: >
      SendGrid API key detected. These keys grant access to email sending,
      template management, and contact lists. Attackers may use them for
      phishing campaigns or spam.
    fix: >
      Use SendGrid API keys with restricted scopes (mail.send only).
      Store in environment variables. Rotate exposed keys.
    metadata:
      cwe: "CWE-798"
      provider: "sendgrid"

  - id: no-heroku-api-key
    name: No hardcoded Heroku API keys
    type: content_not_contains
    pattern: '(?i)heroku_api_key|HEROKU_API_KEY'
    paths:
      - "src/**/*"
      - "**/*.env"
    severity: high
    confidence: 0.92
    message: >
      Heroku API key detected. These keys grant access to apps, dynos,
      config vars, and add-ons.
    fix: >
      Use Heroku OAuth or machine user accounts. Rotate exposed keys.
    metadata:
      cwe: "CWE-798"
      provider: "heroku"

  # ─────────────────────────────────────────────
  # DATABASE & CONNECTION STRINGS
  # ─────────────────────────────────────────────

  - id: no-connection-string-password
    name: No passwords in database connection strings
    type: content_not_contains
    pattern: '(?i)(mongodb|postgres|mysql|mariadb|redis|amqp|mqtt|sqlserver|oracle|snowflake|clickhouse)(\+\w+)?://[^:]+:[^@]+@'
    paths:
      - "src/**/*"
      - "config/**/*"
      - "**/*.env"
      - "**/*.yaml"
      - "**/*.json"
      - "**/*.toml"
    severity: critical
    confidence: 0.96
    message: >
      Database connection string with embedded password detected. This
      exposes database credentials to anyone with repository access and
      makes rotation difficult (requires code changes + DB changes).
    fix: >
      Use environment variable references:
      postgresql://user:${DB_PASSWORD}@host/db
      Or use a secrets manager with dynamic credentials (Vault, AWS SM).
      Rotate the database password immediately.
    metadata:
      cwe: "CWE-798"
      category: "database-credentials"

  - id: no-mongodb-uri
    name: No hardcoded MongoDB connection URIs with credentials
    type: content_not_contains
    pattern: 'mongodb(\+srv)?://[^:]+:[^@]+@'
    paths:
      - "src/**/*"
      - "**/*.env"
      - "**/*.yaml"
    severity: critical
    confidence: 0.95
    message: >
      MongoDB connection URI with embedded credentials detected. MongoDB
      credentials often have broad database permissions.
    fix: >
      Use environment variables or MongoDB Atlas connection string secrets.
      Enable IP allow-listing and TLS.
    metadata:
      cwe: "CWE-798"
      category: "database-credentials"
      provider: "mongodb"

  - id: no-redis-password
    name: No hardcoded Redis passwords
    type: content_not_contains
    pattern: '(?i)redis_password|REDIS_PASSWORD|redis_pass|REDIS_PASS|requirepass\s+[^\s]+'
    paths:
      - "src/**/*"
      - "**/*.env"
      - "**/*.conf"
    severity: high
    confidence: 0.93
    message: >
      Redis password detected. Redis is often exposed without authentication
      in development. A hardcoded password in production config is a
      significant risk if the Redis instance is network-accessible.
    fix: >
      Use Redis ACL with usernames and passwords stored in a secrets manager.
      Enable TLS for Redis connections. Restrict network access with VPCs.
    metadata:
      cwe: "CWE-798"
      category: "database-credentials"
      provider: "redis"

  # ─────────────────────────────────────────────
  # CRYPTOGRAPHIC KEYS
  # ─────────────────────────────────────────────

  - id: no-private-key-block
    name: No private key blocks in source
    type: content_not_contains
    pattern: '-----BEGIN\s+(RSA\s+|EC\s+|DSA\s+|OPENSSH\s+|PGP\s+)?PRIVATE\s+KEY-----'
    paths:
      - "src/**/*"
      - "config/**/*"
      - "**/*.pem"
      - "**/*.key"
      - "**/*.p12"
      - "**/*.pfx"
    severity: critical
    confidence: 0.99
    message: >
      Private key material detected. Private keys must never be stored in
      repositories. Exposure allows impersonation, decryption of traffic,
      signing of malicious artifacts, and lateral movement.
    fix: >
      Remove the key. Purge from git history with git filter-repo.
      Store in a secrets manager (AWS SM, Vault, Azure KV) or HSM.
      Generate a new key pair. Revoke the old public key everywhere.
    metadata:
      cwe: "CWE-798"
      category: "cryptographic-keys"

  - id: no-certificate-private-key
    name: No certificate private keys in source
    type: content_not_contains
    pattern: '-----BEGIN\s+ENCRYPTED\s+PRIVATE\s+KEY-----|-----BEGIN\s+PRIVATE\s+KEY-----'
    paths:
      - "src/**/*"
      - "**/*.pem"
      - "**/*.key"
      - "**/*.p12"
    severity: critical
    confidence: 0.99
    message: >
      TLS/SSL certificate private key detected. These keys protect
      encrypted communications. Exposure allows man-in-the-middle attacks
      and decryption of past traffic (if forward secrecy is not used).
    fix: >
      Use certificate management automation (cert-manager, Let's Encrypt,
      AWS ACM). Store private keys in a secrets manager or HSM.
    metadata:
      cwe: "CWE-798"
      category: "cryptographic-keys"

  - id: no-jwt-secret
    name: No hardcoded JWT secrets
    type: content_not_contains
    pattern: '(?i)(jwt[_-]?secret|jwt[_-]?key|jwt_signing_key|token_secret)\s*[:=]\s*[''"'']?[^''"''\s]{8,}[''"'']?'
    paths:
      - "src/**/*"
      - "**/*.env"
      - "**/*.yaml"
      - "**/*.json"
    severity: critical
    confidence: 0.94
    message: >
      Hardcoded JWT signing secret detected. If exposed, attackers can
      forge authentication tokens and impersonate any user, including
      administrators, bypassing all access controls.
    fix: >
      Use a cryptographically random secret (256+ bits) stored in a secrets
      manager. Rotate the secret and invalidate all existing tokens.
      Use RS256/ES256 with key rotation instead of HS256 where possible.
    metadata:
      cwe: "CWE-798"
      category: "cryptographic-keys"

  - id: no-ssh-private-key
    name: No SSH private keys in source
    type: content_not_contains
    pattern: '-----BEGIN\s+OPENSSH\s+PRIVATE\s+KEY-----'
    paths:
      - "src/**/*"
      - "**/*.pem"
      - "**/*.key"
      - "**/*.ssh"
    severity: critical
    confidence: 0.99
    message: >
      SSH private key detected. SSH keys grant shell access to servers.
      Exposure allows attackers to pivot across your infrastructure,
      access production systems, and establish persistent access.
    fix: >
      Use SSH certificates (short-lived, signed by a CA) instead of
      long-lived keys. Store keys in ssh-agent or a hardware token (YubiKey).
      Rotate all exposed keys and audit authorized_keys files.
    metadata:
      cwe: "CWE-798"
      category: "cryptographic-keys"

  # ─────────────────────────────────────────────
  # GENERIC API KEYS & TOKENS
  # ─────────────────────────────────────────────

  - id: no-generic-api-key
    name: No hardcoded generic API keys
    type: content_not_contains
