api_version: qedty.policy/v2
kind: Policy
metadata:
  id: QEDTY-SECRETS
  title: QEDTY secrets, cryptographic material, and trust-boundary policy
  version: 2.0.0
  owner: IRIN-0
  status: active
enforcement: {default_mode: enforce, high_severity: enforce}
controls:
  - id: QEDTY-SEC-001
    severity: critical
    mode: enforce
    scope: [git, CI, artifacts, logs]
    requirements: [Secrets MUST NOT be committed., Secrets MUST NOT enter artifacts or logs., Telemetry MUST redact secret material.]
  - id: QEDTY-SEC-002
    severity: critical
    mode: enforce
    scope: [GitHub]
    requirements: [Secret scanning MUST be enabled where supported., Push protection SHOULD be enabled for supported patterns., Custom patterns SHOULD be dry-run tested before enforcement.]
  - id: QEDTY-SEC-003
    severity: critical
    mode: enforce
    scope: [CI]
    requirements: [Prefer short-lived OIDC identities over long-lived cloud credentials., id-token: write MUST be restricted to jobs that mint OIDC identity/provenance., Fork pull-request code MUST NOT receive privileged secrets.]
  - id: QEDTY-SEC-004
    severity: high
    mode: enforce
    scope: [cryptography]
    requirements: [Private keys MUST use an approved key-management process., Configuration SHOULD reference secret identifiers rather than secret values., Cryptographic algorithm choices MUST be documented.]
  - id: QEDTY-SEC-005
    severity: high
    mode: enforce
    scope: [ingestion, provenance]
    requirements: [Credentials used to retrieve evidence MUST never become evidence content., Authentication metadata MAY be recorded only as redacted mechanism/reference data.]
  - id: QEDTY-SEC-006
    severity: high
    mode: enforce
    scope: [public artifacts]
    requirements: [Credential-bearing URLs MUST never be published., Generated reports MUST undergo secret scanning before distribution.]
  - id: QEDTY-SEC-007
    severity: high
    mode: review
    scope: [secret-scanning bypasses]
    requirements: [Every bypass MUST identify the alert, reason, owner, expiry, and remediation plan.]
references: [GitHub Secret Protection and custom patterns, NIST SP 800-218 SSDF 1.1, SLSA 1.2]
