name: CI

on:
  push:
    branches:
      - main
      - master
      - "release/**"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

# Default-deny permissions.
# Individual jobs explicitly grant only what they require.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:

  # ============================================================
  # 1. LINT / FORMAT
  # ============================================================
  lint:
    name: CI Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff format check
        run: |
          ruff format --check .

      - name: Ruff lint
        run: |
          ruff check .

      - name: Import sort / style validation
        run: |
          ruff check . --select I

      - name: Codespell
        run: |
          if command -v codespell >/dev/null 2>&1; then
            codespell .
          else
            echo "::warning::codespell is not installed; skipping."
          fi

  # ============================================================
  # 2. TYPE CHECK
  # ============================================================
  typecheck:
    name: CI Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Mypy
        run: |
          mypy src

      - name: BasedPyright
        run: |
          if command -v basedpyright >/dev/null 2>&1; then
            basedpyright src
          else
            echo "::warning::basedpyright is not installed; skipping."
          fi

  # ============================================================
  # 3. TEST MATRIX
  # ============================================================
  test:
    name: CI Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"

          - os: ubuntu-latest
            python-version: "3.13"

          - os: ubuntu-latest
            python-version: "3.14"

          - os: macos-latest
            python-version: "3.12"

          - os: macos-latest
            python-version: "3.13"

          - os: macos-latest
            python-version: "3.14"

          - os: windows-latest
            python-version: "3.12"

          - os: windows-latest
            python-version: "3.13"

          # Python 3.14 Windows is intentionally excluded until
          # the dependency/toolchain combination is officially
          # supported by the project.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install project
        run: |
          pip install -e ".[dev]"

      - name: Run unit and integration tests
        run: |
          pytest -q \
            --disable-warnings \
            --maxfail=1

      - name: Verify CLI entry point
        run: |
          seraph --help

  # ============================================================
  # 4. PRE-COMMIT
  # ============================================================
  precommit:
    name: CI Pre-commit Hooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit
        run: |
          pre-commit run --all-files

  # ============================================================
  # 5. SECURITY TOOLCHAIN
  # ============================================================
  security:
    name: CI Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install bandit pip-audit

      - name: Bandit
        run: |
          bandit -r src -ll

      - name: Dependency audit
        run: |
          pip-audit

  # ============================================================
  # 6. BUILD
  #
  # This is the canonical artifact-producing job.
  #
  # IMPORTANT:
  # SLSA provenance MUST attest these exact artifacts.
  # It must NOT rebuild them independently.
  # ============================================================
  build:
    name: CI Build & Verify
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      attestations: write

    outputs:
      artifact_sha256: ${{ steps.hashes.outputs.artifact_sha256 }}
      hashes: ${{ steps.hashes.outputs.hashes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build distribution
        run: |
          rm -rf dist build *.egg-info
          python -m build

      - name: Verify distribution structure
        run: |
          test -d dist
          test -n "$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"

      - name: Validate package metadata
        run: |
          python -m twine check dist/*

      - name: Install built wheel
        shell: bash
        run: |
          python -m venv /tmp/seraph-build-venv
          source /tmp/seraph-build-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Verify installed CLI
        shell: bash
        run: |
          source /tmp/seraph-build-venv/bin/activate
          seraph --help

      - name: Generate artifact hashes
        id: hashes
        shell: bash
        run: |
          set -euo pipefail

          sha256sum dist/* | tee dist/SHA256SUMS

          HASHES="$(
            sha256sum dist/*.whl dist/*.tar.gz |
            base64 -w0
          )"

          ARTIFACT_SHA256="$(
            sha256sum dist/*.whl dist/*.tar.gz |
            sha256sum |
            awk '{print $1}'
          )"

          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$ARTIFACT_SHA256" >> "$GITHUB_OUTPUT"

      # GitHub-native artifact attestation.
      #
      # This attests the EXACT files produced above.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Upload canonical build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seraph-dist-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  # ============================================================
  # 7. SERAPH SELF-DOGFOOD
  # ============================================================
  dogfood:
    name: CI Self-Dogfood Scan
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Seraph against repository
        run: |
          set -o pipefail
          seraph scan . --format json > seraph-self-scan.json

      - name: Upload Seraph self-scan
        uses: actions/upload-artifact@v4
        with:
          name: seraph-self-scan-${{ github.sha }}
          path: seraph-self-scan.json
          if-no-files-found: error
          retention-days: 14

  # ============================================================
  # 8. POLICY / RELEASE READINESS SCAN
  #
  # This job is intentionally blocking on scanner execution.
  # Findings and execution failure are not conflated.
  # ============================================================
  policy-scan:
    name: Seraph Guard Security Scan
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run policy validation
        run: |
          seraph policy validate

      - name: Run full Seraph scan
        shell: bash
        run: |
          set +e

          seraph scan . \
            --format json \
            --output seraph-policy-scan.json

          SCAN_EXIT=$?

          echo "Seraph scanner exit code: ${SCAN_EXIT}"

          # 0 = clean
          # 1 = findings detected
          # >=2 = scanner/runtime failure
          if [ "${SCAN_EXIT}" -ge 2 ]; then
            echo "::error::Seraph scanner/runtime failure."
            exit "${SCAN_EXIT}"
          fi

          echo "${SCAN_EXIT}" > seraph-scan-exit-code.txt

      - name: Upload policy scan evidence
        uses: actions/upload-artifact@v4
        with:
          name: seraph-policy-scan-${{ github.sha }}
          path: |
            seraph-policy-scan.json
            seraph-scan-exit-code.txt
          if-no-files-found: error
          retention-days: 14

  # ============================================================
  # 9. COMPLIANCE REPORT
  # ============================================================
  compliance:
    name: Generate Compliance Report
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test
      - precommit
      - security
      - build
      - dogfood
      - policy-scan

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate CI evidence
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p evidence/ci

          {
            echo "Seraph Guard CI Evidence"
            echo "========================"
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo "Ref: ${GITHUB_REF}"
            echo "Run: ${GITHUB_RUN_ID}"
            echo "Workflow: ${GITHUB_WORKFLOW}"
            echo
            echo "Required CI jobs:"
            echo "- lint"
            echo "- typecheck"
            echo "- test"
            echo "- precommit"
            echo "- security"
            echo "- build"
            echo "- dogfood"
            echo "- policy-scan"
          } > evidence/ci/ci-evidence.txt

      - name: Upload compliance evidence
        uses: actions/upload-artifact@v4
        with:
          name: ci-compliance-${{ github.sha }}
          path: evidence/ci
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  # 10. RELEASE
  #
  # CI remains the SINGLE canonical release publisher.
  #
  # release.yml does NOT publish a second release.
  # SLSA workflow adds provenance to this release afterward.
  # ============================================================
  release:
    name: 🚀 Release
    runs-on: ubuntu-latest

    needs:
      - lint
      - typecheck
      - test
      - precommit
      - security
      - build
      - dogfood
      - policy-scan
      - compliance

    # Release only happens for a semantic version tag.
    #
    # Do not use if: always().
    # A release must fail closed when required CI fails.
    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.lint.result == 'success' &&
      needs.typecheck.result == 'success' &&
      needs.test.result == 'success' &&
      needs.precommit.result == 'success' &&
      needs.security.result == 'success' &&
      needs.build.result == 'success' &&
      needs.dogfood.result == 'success' &&
      needs.policy-scan.result == 'success' &&
      needs.compliance.result == 'success'

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify tag points to current commit
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          HEAD_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-list -n 1 "${TAG}")"

          echo "Release tag: ${TAG}"
          echo "HEAD:        ${HEAD_SHA}"
          echo "Tag target:  ${TAG_SHA}"

          test "${HEAD_SHA}" = "${TAG_SHA}"

      - name: Download canonical build artifacts
        uses: actions/download-artifact@v4
        with:
          name: seraph-dist-${{ github.sha }}
          path: dist

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -n "$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -f dist/SHA256SUMS

          sha256sum -c dist/SHA256SUMS

      - name: Validate release metadata
        run: |
          python -m pip install --upgrade pip twine
          twine check dist/*

      # --------------------------------------------------------
      # PyPI publication
      #
      # Trusted publishing is preferred over long-lived API keys.
      # The repository/PyPI project must be configured to trust
      # this GitHub workflow.
      # --------------------------------------------------------
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      # --------------------------------------------------------
      # GitHub Release
      # --------------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists."
          else
            gh release create "${TAG}" \
              dist/*.whl \
              dist/*.tar.gz \
              dist/SHA256SUMS \
              --title "Seraph Guard ${TAG}" \
              --generate-notes
          fi

      - name: Release summary
        shell: bash
        run: |
          {
            echo "## Seraph Guard Release"
            echo
            echo "- Tag: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Build: canonical CI artifact"
            echo "- GitHub artifact attestation: generated"
            echo "- PyPI: published"
            echo "- GitHub Release: published/verified"
            echo "- SLSA provenance: generated by downstream workflow"
          } >> "${GITHUB_STEP_SUMMARY}"