name: QEDTY CI
on:
  push:
    branches: [main, "release/**", rust]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --all-groups --all-extras
      - run: uv run pytest -q --cov-fail-under=60
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy src
      - run: uv run qedty validate
      - run: uv run python scripts/check_manifest_inventory.py
      - run: uv run qedty demo
      - run: uv run qedty scenario demo
      - run: uv run qedty impact demo
      - name: Run all executable conformance checks
        run: |
          set -euo pipefail
          for script in scripts/check_*_conformance.py; do
            echo "==> ${script}"
            uv run python "${script}"
          done
      - run: uv lock --check
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.99.0
      - name: Verify workspace formatting
        run: cargo fmt --all -- --check
      - name: Test the full Rust workspace
        run: cargo test --workspace --locked
      - name: Lint the full Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run Rust shared golden-vector conformance
        run: cargo run --locked -p qedty-conformance
      - name: Preserve the original native crate entry point
        run: cargo test --locked --manifest-path crates/qedty-core/Cargo.toml
      - name: Verify the declared minimum supported Rust version
        run: |
          rustup toolchain install 1.78.0 --profile minimal
          cargo +1.78.0 test --workspace --locked
  package:
    runs-on: ubuntu-latest
    needs: [quality, native]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups --all-extras
      - run: uv run python -m build
      - run: uv run twine check dist/*
