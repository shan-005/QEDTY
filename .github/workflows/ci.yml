# ═══════════════════════════════════════════════════════════════════════════════
# Seraph Guard — CI/CD Pipeline v2.0 (Production-Grade)
# ═══════════════════════════════════════════════════════════════════════════════
# Upgrades from v1.0:
#   • Concurrency controls (cancel stale runs automatically)
#   • Per-job permissions (principle of least privilege)
#   • Job timeouts (prevent runaway jobs)
#   • Artifact attestation (GitHub native + Sigstore)
#   • Fixed self-dogfood scan (proper multiline, no broken commands)
#   • Release job with PyPI publishing + GitHub Release
#   • SBOM generation (SPDX + CycloneDX)
#   • Proper Windows shell handling
#   • Optional caching (workflow_dispatch toggle)
#   • Removed pointless `needs: clean` chains (fresh runners anyway)
#   • Added `continue-on-error` for non-blocking security reports
#   • FIXED: Replaced `uv pip install -e . --group` with `uv sync --group`
# ═══════════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      nuclear_clean:
        description: "Nuclear clean (no cache, fresh venv)"
        type: boolean
        default: false
      enable_cache:
        description: "Enable uv pip cache"
        type: boolean
        default: true
      publish_testpypi:
        description: "Publish to TestPyPI (tag pushes only)"
        type: boolean
        default: false

# Cancel stale runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  # ── 1. LINT & FORMAT ──────────────────────────────────────────────────────
  lint:
    name: 🎨 Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.x"
          enable-cache: ${{ inputs.enable_cache || true }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fresh Install (lint group)
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv sync --group lint

      - name: Ruff Check
        run: |
          source .venv/bin/activate
          ruff check src tests --output-format=github

      - name: Ruff Format Check
        run: |
          source .venv/bin/activate
          ruff format --check src tests

      - name: Codespell
        run: |
          source .venv/bin/activate
          codespell src tests docs || true

      - name: Vulture (dead code)
        run: |
          source .venv/bin/activate
          vulture src/seraph --min-confidence 80 || true

  # ── 2. TYPE CHECK ─────────────────────────────────────────────────────────
  typecheck:
    name: 🔍 Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.x"
          enable-cache: ${{ inputs.enable_cache || true }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fresh Install (types group)
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv sync --group types

      - name: mypy
        run: |
          source .venv/bin/activate
          mypy src --pretty --show-error-codes

      - name: basedpyright
        run: |
          source .venv/bin/activate
          basedpyright src || true

  # ── 3. SECURITY SCAN (Non-blocking) ────────────────────────────────────────
  security:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.x"
          enable-cache: ${{ inputs.enable_cache || true }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fresh Install (security + runtime)
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv sync --group security

      - name: Bandit
        continue-on-error: true
        run: |
          source .venv/bin/activate
          bandit -r src -f json -o bandit-report.json
          bandit -r src -f screen

      - name: pip-audit
        continue-on-error: true
        run: |
          source .venv/bin/activate
          pip-audit --desc --format=json -o pip-audit-report.json
          pip-audit --desc

      - name: Safety Check
        continue-on-error: true
        run: |
          source .venv/bin/activate
          safety check --full-report

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json

  # ── 4. TEST MATRIX ────────────────────────────────────────────────────────
  test:
    name: 🧪 Test (Py${{ matrix.python }} / ${{ matrix.os }})
    needs: [lint, typecheck]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
        exclude:
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.x"
          enable-cache: ${{ inputs.enable_cache || true }}

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Fresh Install (test group)
        shell: bash
        run: |
          uv venv .venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          uv sync --group test

      - name: Run Tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          pytest -xvs --cov=seraph --cov-report=xml --cov-report=term-missing

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: warn

  # ── 5. BUILD & VERIFY ─────────────────────────────────────────────────────
  build:
    name: 📦 Build & Verify
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.x"
          enable-cache: ${{ inputs.enable_cache || true }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fresh Install (build deps)
        run: |
          uv venv .venv --python 3.13
          source .venv/bin/activate
          python -m pip install build twine check-manifest

      - name: Build Wheel & Sdist
        run: |
          source .venv/bin/activate
          python -m build

      - name: Generate SBOM (SPDX)
        continue-on-error: true
        run: |
          source .venv/bin/activate
          pip install cyclonedx-bom || true
          cyclonedx-py environment --outfile sbom.cyclonedx.json || true

      - name: Check Manifest
        run: |
          source .venv/bin/activate
          check-manifest

      - name: Twine Check
        run: |
          source .venv/bin/activate
          twine check dist/*

      - name: Verify Wheel Install
        run: |
          source .venv/bin/activate
          uv pip install dist/*.whl
          seraph-guard --version

      - name: Generate Artifact Hashes
        id: hash
        run: |
          cd dist
          echo "hashes=$(sha256sum * | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

  # ── 6. SELF-DOGFOOD (Seraph Policy Scan) ──────────────────────────────────
  policy-scan:
    name: 🔱 Self-Dogfood Scan
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.x"
          enable-cache: ${{ inputs.enable_cache || true }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fresh Install
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv sync

      - name: Run Seraph Policy Scanner
        continue-on-error: true
        run: |
          source .venv/bin/activate
          seraph-guard scan \
            --path . \
            --scanner policy \
            --format sarif \
            --output-file seraph-policy-results.sarif

      - name: Run Seraph Full Scan
        continue-on-error: true
        run: |
          source .venv/bin/activate
          seraph-guard scan \
            --path . \
            --format json \
            --output-file seraph-full-results.json

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: seraph-policy-results.sarif
          category: seraph-policy

      - name: Upload Seraph Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seraph-scan-results
          path: |
            seraph-policy-results.sarif
            seraph-full-results.json

  # ── 7. PRE-COMMIT VALIDATION ──────────────────────────────────────────────
  pre-commit:
    name: 🪝 Pre-commit Hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: pip install pre-commit deptry==0.23.0

      - name: Run Pre-commit (all files)
        run: pre-commit run --config policies/builtin/pre-commit-config.yaml --all-files --show-diff-on-failure

  # ── 8. RELEASE (tag pushes only) ──────────────────────────────────────────
  release:
    name: 🚀 Release
    needs: [build, policy-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/seraph-guard
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: false
