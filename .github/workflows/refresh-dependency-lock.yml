name: Dependency Review
on:
  push:
    branches:
      - work/portfolio-conformance-audit-20261016-125139
    paths:
      - .github/workflows/refresh-dependency-lock.yml

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: dependency-lock-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/portfolio-conformance-audit-20261016-125139
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
      - name: Install Python
        run: uv python install 3.12
      - name: Raise affected OpenTelemetry patch constraints
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("pyproject.toml")
          source = path.read_text()
          replacements = {
              "opentelemetry-api>=1.45.0,<1.45.1": "opentelemetry-api>=1.45.1,<1.45.2",
              "opentelemetry-sdk>=1.45.0,<1.45.1": "opentelemetry-sdk>=1.45.1,<1.45.2",
              "opentelemetry-exporter-otlp>=1.45.0,<1.45.1": "opentelemetry-exporter-otlp>=1.45.1,<1.45.2",
          }
          for old, new in replacements.items():
              count = source.count(old)
              if count != 3:
                  raise SystemExit(f"Expected 3 occurrences of {old!r}, found {count}")
              source = source.replace(old, new)
          path.write_text(source)
          PY
      - name: Regenerate secure dependency lock
        run: |
          uv lock \
            --upgrade-package certifi \
            --upgrade-package filelock \
            --upgrade-package opentelemetry-api \
            --upgrade-package opentelemetry-sdk \
            --upgrade-package opentelemetry-exporter-otlp \
            --upgrade-package setuptools \
            --upgrade-package virtualenv
      - name: Install the exact locked environment
        run: uv sync --locked --all-groups --all-extras
      - name: Audit all Python dependencies
        run: uv run --with pyshacl==0.40.1 pip-audit
      - name: Run Python tests
        run: uv run pytest -q --cov-fail-under=60
      - name: Run Ruff and mypy
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
          uv run mypy src
          uv lock --check
      - name: Commit the regenerated lock and remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-dependency-lock.yml
          git add pyproject.toml uv.lock
          git diff --cached --check
          git commit -m "fix: update vulnerable Python dependencies"
          git push origin HEAD:work/portfolio-conformance-audit-20261016-125139
      - name: Verify dependency changes against main
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: main
          head-ref: work/portfolio-conformance-audit-20261016-125139
          fail-on-severity: high
      - name: Dispatch full exact-head CI workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for workflow in ci.yml python-rust-differential.yml rust.yml qedty.yml; do
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/shan-005/QEDTY/actions/workflows/${workflow}/dispatches" \
              -d '{"ref":"work/portfolio-conformance-audit-20261016-125139"}'
          done
