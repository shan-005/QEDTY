name: SLSA Provenance
on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.subjects.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups --all-extras
      - run: uv run pytest -q --cov-fail-under=60
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy src
      - name: Audit Python dependencies
        run: uv run pip-audit
      - name: Scan Python source with Bandit
        run: uv run bandit -r src -ll
      - run: uv run qedty validate
      - run: uv run python scripts/check_manifest_inventory.py
      - run: uv run qedty demo
      - run: uv run qedty scenario demo
      - run: uv run qedty impact demo
      - name: Run executable conformance checks
        run: |
          set -euo pipefail
          for script in scripts/check_*_conformance.py; do
            echo "==> ${script}"
            uv run python "${script}"
          done
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo run --locked -p qedty-conformance
      - run: cargo test --locked --manifest-path crates/qedty-core/Cargo.toml
      - name: Verify the declared minimum supported Rust version
        run: |
          rustup toolchain install 1.78.0 --profile minimal
          cargo +1.78.0 test --workspace --locked
      - run: uv lock --check
      - run: uv run python -m build
      - run: uv run twine check dist/*
      - name: Compute SLSA subjects
        id: subjects
        shell: bash
        run: |
          set -euo pipefail
          echo "hashes=$(sha256sum dist/*.whl dist/*.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"
  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
