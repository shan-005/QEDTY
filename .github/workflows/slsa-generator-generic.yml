# ═══════════════════════════════════════════════════════════════════════════════
# Seraph Guard — SLSA Level 3 Provenance
# ═══════════════════════════════════════════════════════════════════════════════
#
# PURPOSE
# -------
# Generates SLSA Build Level 3 provenance for the EXACT artifacts produced by
# the successful Seraph Guard CI workflow.
#
# IMPORTANT ARCHITECTURE
# ----------------------
# This workflow does NOT rebuild the package.
#
# The canonical build happens in:
#
#   .github/workflows/ci.yml
#
# This workflow:
#
#   1. Waits for CI to complete successfully on a version tag.
#   2. Downloads the exact dist/ artifacts from that CI run.
#   3. Computes SHA-256 subjects for those exact files.
#   4. Invokes the SLSA generic generator as a reusable WORKFLOW JOB.
#   5. Uploads the resulting provenance to the existing GitHub release.
#
# This avoids the dangerous situation where:
#
#   CI artifact != independently rebuilt artifact
#
# and provenance is accidentally attached to the wrong bytes.
#
# SECURITY MODEL
# --------------
# - actions: read
# - contents: write
# - id-token: write
#
# The SLSA generator itself is referenced by an immutable release tag.
#
# NOTE
# ----
# GitHub now recommends native artifact attestations for new integrations.
# Seraph already generates a native GitHub artifact attestation in ci.yml.
# This workflow is retained as an additional SLSA/in-toto provenance layer.
#
# ═══════════════════════════════════════════════════════════════════════════════

name: SLSA Provenance

on:
  # Runs after the canonical CI workflow finishes.
  #
  # This is intentionally workflow_run rather than release/push because it lets
  # us retrieve the EXACT artifacts generated by the successful CI execution.
  workflow_run:
    workflows:
      - CI
    types:
      - completed

  # Manual verification / recovery path.
  #
  # This should normally be used only after a successful tagged CI run.
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful CI workflow run ID containing the release artifacts"
        required: true
        type: string
      tag_name:
        description: "Existing Git tag / GitHub Release tag to receive provenance"
        required: true
        type: string

# Workflow-level default permissions.
#
# Individual jobs further restrict permissions.
permissions:
  contents: read

concurrency:
  group: slsa-provenance-${{ github.event.workflow_run.id || inputs.run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # 1. VALIDATE THE TRIGGER
  # ═══════════════════════════════════════════════════════════════════════════
  validate:
    name: 🔎 Validate CI Release Source
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      actions: read
      contents: read

    # Only process successful CI runs.
    #
    # For workflow_run events, head_branch is the branch/tag associated with
    # the completed workflow. We require a version tag.
    #
    # Manual workflow_dispatch is also allowed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_branch, 'v')
      )

    outputs:
      source_run_id: ${{ steps.resolve.outputs.run_id }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}

    steps:
      - name: Resolve source CI run
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_TAG_NAME: ${{ github.event.workflow_run.head_branch }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            RUN_ID="${INPUT_RUN_ID}"
            TAG_NAME="${INPUT_TAG_NAME}"
          else
            RUN_ID="${EVENT_RUN_ID}"
            TAG_NAME="${EVENT_TAG_NAME}"
          fi

          if [[ -z "${RUN_ID}" ]]; then
            echo "::error::No source CI run ID was resolved."
            exit 1
          fi

          if [[ -z "${TAG_NAME}" ]]; then
            echo "::error::No release tag was resolved."
            exit 1
          fi

          if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::Resolved tag '${TAG_NAME}' is not a valid Seraph version tag."
            exit 1
          fi

          echo "Source CI run : ${RUN_ID}"
          echo "Release tag   : ${TAG_NAME}"

          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. DOWNLOAD EXACT CI ARTIFACTS + CREATE SLSA SUBJECTS
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: 📦 Resolve Release Artifacts
    needs:
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      actions: read
      contents: read

    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

    steps:
      - name: Download exact CI build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
          repository: ${{ github.repository }}
          run-id: ${{ needs.validate.outputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Verify artifact set
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d dist ]]; then
            echo "::error::dist/ directory was not downloaded."
            exit 1
          fi

          mapfile -t ARTIFACTS < <(
            find dist \
              -maxdepth 1 \
              -type f \
              \( -name '*.whl' -o -name '*.tar.gz' \) \
              -print \
              | sort
          )

          if [[ "${#ARTIFACTS[@]}" -eq 0 ]]; then
            echo "::error::No Python distribution artifacts were found."
            exit 1
          fi

          echo "Release artifacts:"
          printf '  %s\n' "${ARTIFACTS[@]}"

      - name: Generate SHA-256 subjects
        id: hash
        shell: bash
        run: |
          set -euo pipefail

          cd dist

          mapfile -t FILES < <(
            find . \
              -maxdepth 1 \
              -type f \
              \( -name '*.whl' -o -name '*.tar.gz' \) \
              -printf '%f\n' \
              | sort
          )

          if [[ "${#FILES[@]}" -eq 0 ]]; then
            echo "::error::No release artifacts available for hashing."
            exit 1
          fi

          sha256sum "${FILES[@]}" > ../slsa-subjects.txt

          echo "SLSA subjects:"
          cat ../slsa-subjects.txt

          HASHES="$(base64 -w0 ../slsa-subjects.txt)"

          if [[ -z "${HASHES}" ]]; then
            echo "::error::Failed to generate base64 SLSA subjects."
            exit 1
          fi

          echo "hashes=${HASHES}" >> "${GITHUB_OUTPUT}"

      - name: Verify hashes are stable
        shell: bash
        run: |
          set -euo pipefail

          cd dist

          sha256sum -c ../slsa-subjects.txt

          echo "All release artifact hashes verified."

      - name: Upload provenance input evidence
        uses: actions/upload-artifact@v4
        with:
          name: slsa-subjects
          path: slsa-subjects.txt
          if-no-files-found: error
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════════════════
  # 3. SLSA LEVEL 3 PROVENANCE
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # IMPORTANT:
  # This is a reusable workflow.
  #
  # It MUST be invoked at jobs.<job_id>.uses.
  #
  # It must NOT be placed inside steps[*].uses.
  #
  # This was the structural defect in the previous implementation.
  #
  # ═══════════════════════════════════════════════════════════════════════════
  provenance:
    name: 🔏 SLSA Level 3 Provenance
    needs:
      - validate
      - build

    permissions:
      actions: read
      id-token: write
      contents: write

    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0

    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      provenance-name: seraph-guard.intoto.jsonl
      upload-assets: true
      upload-tag-name: ${{ needs.validate.outputs.tag_name }}

  # ═══════════════════════════════════════════════════════════════════════════
  # 4. FINAL VERIFICATION
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # This does not attempt to cryptographically replace the SLSA verifier.
  # It establishes a machine-readable CI record that:
  #
  #   - source CI run succeeded
  #   - a release tag was resolved
  #   - release artifacts existed
  #   - artifact hashes were generated and verified
  #   - provenance generation completed
  #
  # ═══════════════════════════════════════════════════════════════════════════
  verify:
    name: ✅ Verify Provenance Pipeline
    needs:
      - validate
      - build
      - provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Verify completed provenance job
        shell: bash
        env:
          TAG_NAME: ${{ needs.validate.outputs.tag_name }}
          SOURCE_RUN_ID: ${{ needs.validate.outputs.source_run_id }}
          PROVENANCE_RESULT: ${{ needs.provenance.result }}
        run: |
          set -euo pipefail

          echo "════════════════════════════════════════════════════════════════"
          echo "SERAPH GUARD — SLSA PROVENANCE VERIFICATION"
          echo "════════════════════════════════════════════════════════════════"
          echo
          echo "Source CI run : ${SOURCE_RUN_ID}"
          echo "Release tag   : ${TAG_NAME}"
          echo "Provenance    : ${PROVENANCE_RESULT}"
          echo

          if [[ "${PROVENANCE_RESULT}" != "success" ]]; then
            echo "::error::SLSA provenance generation did not succeed."
            exit 1
          fi

          echo "SLSA provenance generation completed successfully."