name: SLSA Provenance
on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.subjects.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups --all-extras
      - run: uv run pytest -q
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy src
      - run: uv run qedty validate
      - run: uv run python scripts/check_manifest_inventory.py
      - run: uv run qedty demo
      - run: uv run qedty scenario demo
      - run: uv run qedty impact demo
      - name: Run executable conformance checks
        run: |
          set -euo pipefail
          for script in scripts/check_*_conformance.py; do
            echo "==> ${script}"
            uv run python "${script}"
          done
      - run: cargo test --manifest-path crates/qedty-core/Cargo.toml
      - run: uv lock --check
      - run: uv run python -m build
      - run: uv run twine check dist/*
      - name: Compute SLSA subjects
        id: subjects
        shell: bash
        run: |
          set -euo pipefail
          echo "hashes=$(sha256sum dist/*.whl dist/*.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"
  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
