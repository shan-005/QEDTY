name: SERAPH Platform Smoke
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: 0.12.23}
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups --all-extras
      - run: uv run seraph demo --format json
      - run: uv run seraph scenario demo --format json
      - run: uv run seraph impact demo --format json
