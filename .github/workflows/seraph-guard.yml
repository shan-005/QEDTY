name: Seraph Guard Security Scan

on:
  push:
    branches: [main, develop, 'release/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  schedule:
    # Weekly security scan on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      scan_level:
        description: 'Scan depth level'
        required: true
        default: 'standard'
        type: choice
        options:
          - quick
          - standard
          - deep

permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read
  checks: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  SERAPH_VERSION: 'latest'
  GITLEAKS_VERSION: '8.18.4'

jobs:
  # ─────────────────────────────────────────────
  # MAIN SECURITY SCAN
  # ─────────────────────────────────────────────
  security-scan:
    name: Seraph Guard Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      findings_count: ${{ steps.scan.outputs.findings_count }}
      critical_count: ${{ steps.scan.outputs.critical_count }}
      scan_duration: ${{ steps.scan.outputs.duration }}
      baseline_changed: ${{ steps.baseline.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0  # Full history for secret scanning
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache scanner binaries
        uses: actions/cache@v6
        id: scanner-cache
        with:
          path: /usr/local/bin/gitleaks
          key: ${{ runner.os }}-scanners-gitleaks-${{ env.GITLEAKS_VERSION }}

      - name: Install Seraph Guard
        run: |
          python -m pip install ".[iac]"
          seraph-guard --version

      - name: Install Gitleaks
        if: steps.scanner-cache.outputs.cache-hit != 'true'
        run: |
          wget -qO- https://github.com/gitleaks/gitleaks/releases/download/v${{ env.GITLEAKS_VERSION }}/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz | tar xz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Initialize Seraph Guard
        run: |
          seraph-guard init --path .
          echo "Seraph Guard initialized"

      - name: Download previous scan baseline
        id: baseline
        uses: actions/cache@v6
        with:
          path: .seraph-baseline.json
          key: seraph-baseline-${{ github.ref }}
          restore-keys: |
            seraph-baseline-

      - name: Run Seraph Guard scan
        id: scan
        continue-on-error: true
        run: |
          SCAN_ARGS="--path . --format sarif --output-file seraph-guard.sarif --explain --rank-by-impact"

          # Add baseline comparison if available
          if [ -f ".seraph-baseline.json" ]; then
            SCAN_ARGS="$SCAN_ARGS --baseline .seraph-baseline.json"
            echo "baseline_used=true" >> $GITHUB_OUTPUT
          else
            echo "baseline_used=false" >> $GITHUB_OUTPUT
          fi

          # Adjust scan level based on input
          if [ "${{ github.event.inputs.scan_level }}" = "quick" ]; then
            SCAN_ARGS="$SCAN_ARGS --severity-threshold high --timeout 120"
          elif [ "${{ github.event.inputs.scan_level }}" = "deep" ]; then
            SCAN_ARGS="$SCAN_ARGS --learn --timeout 600"
          else
            SCAN_ARGS="$SCAN_ARGS --timeout 300"
          fi

          echo "Running: seraph-guard scan $SCAN_ARGS"
          seraph-guard scan $SCAN_ARGS --fail-on high || SCAN_EXIT=$?

          # Extract metrics from SARIF
          if [ -f "seraph-guard.sarif" ]; then
            TOTAL=$(jq '.runs[0].results | length' seraph-guard.sarif)
            CRITICAL=$(jq '[.runs[0].results[] | select(.level == "error")] | length' seraph-guard.sarif)
            echo "findings_count=$TOTAL" >> $GITHUB_OUTPUT
            echo "critical_count=$CRITICAL" >> $GITHUB_OUTPUT
          fi

          echo "duration=${{ steps.scan.outputs.duration || '0' }}" >> $GITHUB_OUTPUT

          # Exit with scan result
          exit ${SCAN_EXIT:-0}

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('seraph-guard.sarif') != ''
        with:
          sarif_file: seraph-guard.sarif
          category: seraph-guard
          wait-for-processing: true

      - name: Save current scan as new baseline
        if: github.ref == 'refs/heads/main' && hashFiles('seraph-guard.sarif') != ''
        run: |
          # Convert SARIF to baseline format
          jq '{
            "timestamp": now | todate,
            "commit": "${{ github.sha }}",
            "findings": [.runs[0].results[] | {
              "id": .partialFingerprints.primaryLocationLineHash,
              "rule": .ruleId,
              "level": .level,
              "message": .message.text
            }]
          }' seraph-guard.sarif > .seraph-baseline.json

      - name: Generate PR annotations
        if: github.event_name == 'pull_request'
        run: |
          seraph-guard scan \
            --path . \
            --format github \
            --rank-by-impact \
            --severity-threshold medium \
            > seraph-annotations.txt || true

      - name: Generate JSON report
        run: |
          seraph-guard scan \
            --path . \
            --format json \
            --output-file seraph-findings.json \
            --rank-by-impact || true

      - name: Generate HTML dashboard
        if: always()
        run: |
          seraph-guard report \
            --path . \
            --format html \
            --output seraph-report || echo "Report generation skipped"

      - name: Generate executive summary
        if: always()
        run: |
          seraph-guard report \
            --path . \
            --format executive \
            --output seraph-executive || echo "Executive summary skipped"

      - name: Generate SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seraph-security-reports-${{ github.run_number }}
          path: |
            seraph-guard.sarif
            seraph-findings.json
            seraph-report.html
            seraph-executive.txt
            seraph-annotations.txt
            sbom.spdx.json
          retention-days: 90
          if-no-files-found: warn

      - name: Upload SARIF artifact
        if: always() && hashFiles('seraph-guard.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seraph-sarif-${{ github.run_number }}
          path: seraph-guard.sarif
          retention-days: 30

      - name: Post PR summary comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let summary = '## 🛡️ Seraph Guard Security Scan\n\n';
            summary += `**Run:** [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n`;
            summary += `**Commit:** \`${context.sha.substring(0, 7)}\`\n\n`;

            try {
              const sarifPath = 'seraph-guard.sarif';
              if (fs.existsSync(sarifPath)) {
                const sarif = JSON.parse(fs.readFileSync(sarifPath, 'utf8'));
                const results = sarif.runs?.[0]?.results || [];
                const total = results.length;
                const critical = results.filter(r => r.level === 'error').length;
                const warning = results.filter(r => r.level === 'warning').length;
                const note = results.filter(r => r.level === 'note').length;

                summary += '### Summary\n\n';
                summary += '| Severity | Count |\n';
                summary += '|----------|-------|\n';
                summary += `| 🔴 Critical/High | ${critical} |\n`;
                summary += `| 🟡 Medium | ${warning} |\n`;
                summary += `| 🔵 Low/Info | ${note} |\n`;
                summary += `| **Total** | **${total}** |\n\n`;

                if (total === 0) {
                  summary += '### ✅ No Security Findings\n\n';
                  summary += 'Great job! No security issues detected.\n';
                } else {
                  summary += '### ⚠️ Security Findings Detected\n\n';
                  summary += 'Check the [Security tab](../../security) for detailed findings.\n\n';

                  // Show top 5 findings
                  const topFindings = results.slice(0, 5);
                  summary += '#### Top Findings\n\n';
                  topFindings.forEach((finding, idx) => {
                    const severity = finding.level === 'error' ? '🔴' : finding.level === 'warning' ? '🟡' : '🔵';
                    const message = finding.message?.text || 'No description';
                    const location = finding.locations?.[0]?.physicalLocation?.artifactLocation?.uri || 'unknown';
                    summary += `${idx + 1}. ${severity} **${message.substring(0, 80)}** - \`${location}\`\n`;
                  });
                }
              } else {
                summary += '⚠️ SARIF file not found. Check workflow logs.\n';
              }
            } catch (e) {
              summary += `⚠️ Error parsing results: ${e.message}\n`;
            }

            summary += '\n---\n';
            summary += '📊 [Download full HTML report](../../actions/runs/${{ github.run_id }})\n';
            summary += '🔧 Run `seraph-guard fix --all` locally to auto-fix issues\n';

            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🛡️ Seraph Guard Security Scan')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: summary
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            }

      - name: Fail workflow if critical findings
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::Security scan failed with critical/high severity findings"
          echo "Review the Security tab or download the HTML report for details"
          exit 1

  # ─────────────────────────────────────────────
  # AUTO-FIX PULL REQUEST (for safe fixes)
  # ─────────────────────────────────────────────
  auto-fix-pr:
    name: Create Auto-Fix PR
    needs: security-scan
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Seraph Guard
        run: python -m pip install ".[iac]"

      - name: Evaluate auto-fix eligibility
        id: eligibility
        run: |
          if [ "${{ needs.security-scan.result }}" != "success" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Auto-fix disabled because the security scan did not succeed."
            exit 0
          fi

          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Auto-fix only applies to main."
            exit 0
          fi

          if [ "${{ needs.security-scan.outputs.findings_count }}" -le 0 ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "No findings require an auto-fix."
            exit 0
          fi

          if [ "${{ needs.security-scan.outputs.critical_count }}" -ne 0 ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Auto-fix disabled because critical findings are present."
            exit 0
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Attempt auto-fixes
        if: steps.eligibility.outputs.eligible == 'true'
        id: autofix
        run: |
          seraph-guard fix --path . --all --dry-run > fix-preview.txt 2>&1 || true

          # Check if any fixes were identified
          if grep -q "Fixed:" fix-preview.txt && ! grep -q "Fixed: 0" fix-preview.txt; then
            echo "has_fixes=true" >> $GITHUB_OUTPUT
          else
            echo "has_fixes=false" >> $GITHUB_OUTPUT
          fi

      - name: Apply fixes and create PR
        if: steps.eligibility.outputs.eligible == 'true' && steps.autofix.outputs.has_fixes == 'true'
        run: |
          # Create a new branch
          BRANCH_NAME="seraph-guard/auto-fix-$(date +%Y%m%d-%H%M%S)"
          git checkout -b $BRANCH_NAME

          # Apply fixes
          seraph-guard fix --path . --all

          # Check if there are changes
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Commit and push
          git config user.name "Seraph Guard Bot"
          git config user.email "seraph-guard[bot]@users.noreply.github.com"
          # Stage only tracked modifications produced by the fixer.
          # Never stage unrelated/generated/untracked workflow artifacts.
          git add -u
          git commit -m "🛡️ chore: auto-fix security findings

          Automated security fixes applied by Seraph Guard.

          - Upgraded vulnerable dependencies
          - Created missing security files
          - Removed hardcoded secrets

          Co-authored-by: Seraph Guard Bot <seraph-guard[bot]@users.noreply.github.com>"

          git push origin $BRANCH_NAME

          # Create PR
          gh pr create \
            --title "🛡️ Auto-fix security findings" \
            --body "## Automated Security Fixes

          This PR was automatically created by Seraph Guard to fix security findings.

          ### Changes Applied
          - Upgraded vulnerable dependencies to patched versions
          - Created missing security policy files (SECURITY.md, CODEOWNERS)
          - Removed hardcoded secrets from source code
          - Updated .gitignore to prevent future secret commits

          ### Review Checklist
          - [ ] Verify dependency upgrades don't break functionality
          - [ ] Confirm secrets have been rotated in production
          - [ ] Test application after dependency changes
          - [ ] Review auto-generated policy files

          ### Next Steps
          1. Review the changes in this PR
          2. Run tests to ensure nothing broke
          3. Merge if everything looks good

          ---
          🤖 Generated by [Seraph Guard](https://github.com/IRIN-0/seraph)" \
            --label "security,automated" \
            --assignee "${{ github.actor }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # COMPLIANCE MAPPING
  # ─────────────────────────────────────────────
  compliance-report:
    name: Generate Compliance Report
    needs: security-scan
    if: always() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Seraph Guard
        run: python -m pip install ".[iac]"

      - name: Generate findings for compliance
        run: |
          set +e
          seraph-guard scan \
            --path . \
            --format json \
            --output-file seraph-findings.json \
            --rank-by-impact
          scan_exit=$?
          set -e

          if [ ! -s seraph-findings.json ]; then
            echo "::error::Compliance scan failed to produce seraph-findings.json."
            exit 1
          fi

          if [ "$scan_exit" -ne 0 ]; then
            echo "Compliance scan returned $scan_exit because findings were detected."
            echo "The findings file was generated successfully; continuing."
          else
            echo "Compliance scan completed successfully with no blocking findings."
          fi

      - name: Generate compliance mapping
        run: |
          cat > compliance-mapping.py << 'EOF'
          import json
          from pathlib import Path

          # Load findings
          findings_file = Path("seraph-findings.json")
          if not findings_file.exists():
              print("No findings file found")
              exit(0)

          data = json.loads(findings_file.read_text())
          findings = data.get("findings", [])

          # Map to compliance frameworks
          frameworks = {
              "SOC 2": {
                  "CC6.1": "Logical Access Controls",
                  "CC6.6": "System Operations",
                  "CC7.2": "System Monitoring",
              },
              "ISO 27001": {
                  "A.12.6.1": "Management of technical vulnerabilities",
                  "A.14.2.5": "Secure system engineering principles",
                  "A.9.4.3": "Use of privileged utility programs",
              },
              "PCI DSS": {
                  "6.5": "Address common coding vulnerabilities",
                  "6.2": "Establish a process to identify security vulnerabilities",
              },
          }

          # Generate report
          report = {
              "generated": "${{ github.event.repository.updated_at }}",
              "total_findings": len(findings),
              "compliance_gaps": {},
          }

          for framework, controls in frameworks.items():
              report["compliance_gaps"][framework] = {}
              for control_id, control_name in controls.items():
                  # Count findings that map to this control
                  relevant = [f for f in findings if control_id.lower() in f.get("description", "").lower()]
                  report["compliance_gaps"][framework][control_id] = {
                      "name": control_name,
                      "findings_count": len(relevant),
                      "status": "compliant" if len(relevant) == 0 else "non-compliant",
                  }

          Path("compliance-report.json").write_text(json.dumps(report, indent=2))
          print("Compliance report generated")
          EOF

          python compliance-mapping.py

      - name: Upload compliance report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compliance-report-${{ github.run_number }}
          path: compliance-report.json
          retention-days: 365

  # ─────────────────────────────────────────────
  # NOTIFICATION
  # ─────────────────────────────────────────────
  notify:
    name: Send Notifications
    needs: [security-scan, auto-fix-pr]
    if: always() && (needs.security-scan.outputs.critical_count > 0 || needs.security-scan.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Notify on Slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg critical "${{ needs.security-scan.outputs.critical_count }}" \
            --arg total "${{ needs.security-scan.outputs.findings_count }}" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              text: "Seraph Guard Security Alert",
              blocks: [
                {
                  type: "header",
                  text: {
                    type: "plain_text",
                    text: "Seraph Guard Security Scan Results"
                  }
                },
                {
                  type: "section",
                  fields: [
                    {
                      type: "mrkdwn",
                      text: ("*Repository:*\n" + $repo)
                    },
                    {
                      type: "mrkdwn",
                      text: ("*Branch:*\n" + $branch)
                    },
                    {
                      type: "mrkdwn",
                      text: ("*Critical Findings:*\n" + $critical)
                    },
                    {
                      type: "mrkdwn",
                      text: ("*Total Findings:*\n" + $total)
                    }
                  ]
                },
                {
                  type: "actions",
                  elements: [
                    {
                      type: "button",
                      text: {
                        type: "plain_text",
                        text: "View Report"
                      },
                      url: $run_url
                    }
                  ]
                }
              ]
            }' > slack-payload.json

          curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            -X POST \
            -H 'Content-Type: application/json' \
            --data-binary @slack-payload.json \
            "$SLACK_WEBHOOK_URL"

      - name: Create GitHub Issue for critical findings
        if: needs.security-scan.outputs.critical_count > 0
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const title = `🛡️ Critical Security Findings Detected (${new Date().toISOString().split('T')[0]})`;
            const body = `## Critical Security Alert

            Seraph Guard detected **${{ needs.security-scan.outputs.critical_count }}** critical security findings in the \`${{ github.ref_name }}\` branch.

            ### Immediate Action Required
            1. Review findings in the [Security tab](../../security)
            2. Assess impact and prioritize remediation
            3. Apply fixes or mitigations within 24 hours
            4. Verify fixes with a re-scan

            ### Resources
            - [View full scan report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [Security policy](../../security/policy)
            - [Incident response playbook](../../wiki/Incident-Response)

            ---
            🤖 This issue was automatically created by Seraph Guard.
            `;

            // Check if similar issue already exists
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,critical'
            });

            const existingIssue = issues.find(issue =>
              issue.title.includes('Critical Security Findings') &&
              new Date(issue.created_at) > new Date(Date.now() - 7 * 24 * 60 * 60 * 1000)
            );

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['security', 'critical', 'automated']
              });
            }
