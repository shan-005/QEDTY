name: QEDTY Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: {version: 0.12.23}
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups --all-extras
      - run: uv run pytest -q
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy src
      - run: uv run qedty validate
      - run: uv run python scripts/check_manifest_inventory.py
      - run: uv run qedty demo
      - run: uv run qedty scenario demo
      - run: uv run qedty impact demo
      - name: Run executable conformance checks
        run: |
          set -euo pipefail
          for script in scripts/check_*_conformance.py; do
            echo "==> ${script}"
            uv run python "${script}"
          done
      - run: cargo test --manifest-path crates/qedty-core/Cargo.toml
      - run: uv lock --check
      - run: uv run python -m build
      - run: uv run twine check dist/*
      - name: Generate checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qedty-${{ github.ref_name }}
          path: dist/*
