name: QEDTY Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: {version: 0.12.23}
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups --all-extras
      - run: uv run pytest -q --cov-fail-under=60
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy src
      - run: uv run qedty validate
      - run: uv run python scripts/check_manifest_inventory.py
      - run: uv run qedty demo
      - run: uv run qedty scenario demo
      - run: uv run qedty impact demo
      - name: Run executable conformance checks
        run: |
          set -euo pipefail
          for script in scripts/check_*_conformance.py; do
            echo "==> ${script}"
            uv run python "${script}"
          done
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo run --locked -p qedty-conformance
      - run: cargo test --locked --manifest-path crates/qedty-core/Cargo.toml
      - name: Verify the declared minimum supported Rust version
        run: |
          rustup toolchain install 1.78.0 --profile minimal
          cargo +1.78.0 test --workspace --locked
      - run: uv lock --check
      - run: uv run python -m build
      - name: Configure source SBOM exclusions
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/qedty-syft.yaml" <<'EOF'
          exclude:
            - "./.git/**"
            - "./.venv/**"
            - "./.cache/**"
            - "./.uv-cache/**"
            - "./target/**"
            - "./dist/**"
            - "./build/**"
            - "./htmlcov/**"
            - "./.mypy_cache/**"
            - "./.pytest_cache/**"
            - "./.ruff_cache/**"
          EOF
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          config: ${{ runner.temp }}/qedty-syft.yaml
          format: spdx-json
          output-file: dist/qedty-sbom.spdx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false
      - run: uv run twine check dist/*.whl dist/*.tar.gz
      - name: Generate checksums for distributable assets
        run: sha256sum dist/*.whl dist/*.tar.gz dist/qedty-sbom.spdx.json > dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qedty-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
      - name: Publish versioned release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/qedty-sbom.spdx.json
            dist/SHA256SUMS
