# ═══════════════════════════════════════════════════════════════════════════════
# Seraph Guard — Release Integrity Verification
# ═══════════════════════════════════════════════════════════════════════════════
#
# PURPOSE
# -------
# This workflow DOES NOT publish releases.
#
# Canonical release publication remains in:
#
#   .github/workflows/ci.yml
#
# This workflow independently verifies the release boundary after a GitHub
# Release is published.
#
# It verifies:
#
#   1. The release corresponds to a version tag.
#   2. The tag points to a real commit.
#   3. The release is not a draft.
#   4. The release is not a prerelease unless explicitly intended.
#   5. Release assets exist.
#   6. Python distribution artifacts exist.
#   7. Artifact SHA-256 hashes can be generated.
#   8. The release has the expected provenance asset when available.
#
# IMPORTANT
# ---------
# This workflow is verification-only.
#
# It intentionally does NOT:
#
#   - publish to PyPI
#   - create GitHub Releases
#   - mutate source code
#   - overwrite release assets
#
# This prevents duplicate release authorities and makes CI.yml the single
# canonical release publisher.
#
# ═══════════════════════════════════════════════════════════════════════════════

name: Release Integrity

on:
  release:
    types:
      - published

  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing GitHub Release tag to verify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-integrity-${{ github.event.release.id || inputs.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    name: 🔐 Verify Published Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      # ════════════════════════════════════════════════════════════════════════
      # 1. RESOLVE RELEASE
      # ════════════════════════════════════════════════════════════════════════
      - name: Resolve release metadata
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG_NAME: ${{ github.event.release.tag_name }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG_NAME="${INPUT_TAG_NAME}"
          else
            TAG_NAME="${EVENT_TAG_NAME}"
          fi

          if [[ -z "${TAG_NAME}" ]]; then
            echo "::error::Unable to resolve release tag."
            exit 1
          fi

          if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::Release tag '${TAG_NAME}' does not match Seraph version-tag policy."
            exit 1
          fi

          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"

          echo "Release tag: ${TAG_NAME}"

      # ════════════════════════════════════════════════════════════════════════
      # 2. CHECKOUT EXACT RELEASE TAG
      # ════════════════════════════════════════════════════════════════════════
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag_name }}
          fetch-depth: 0

      # ════════════════════════════════════════════════════════════════════════
      # 3. VERIFY GIT TAG
      # ════════════════════════════════════════════════════════════════════════
      - name: Verify Git tag resolves
        shell: bash
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          if ! git rev-parse --verify "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "::error::Git tag '${TAG_NAME}' does not exist."
            exit 1
          fi

          TAG_SHA="$(git rev-list -n 1 "${TAG_NAME}")"
          HEAD_SHA="$(git rev-parse HEAD)"

          echo "Tag SHA : ${TAG_SHA}"
          echo "HEAD SHA: ${HEAD_SHA}"

          if [[ "${TAG_SHA}" != "${HEAD_SHA}" ]]; then
            echo "::error::Checked-out commit does not match release tag."
            exit 1
          fi

      # ════════════════════════════════════════════════════════════════════════
      # 4. QUERY GITHUB RELEASE
      # ════════════════════════════════════════════════════════════════════════
      - name: Fetch GitHub release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          gh release view "${TAG_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json \
              name \
              tagName \
              isDraft \
              isPrerelease \
              publishedAt \
              url \
              assets \
            > release.json

          cat release.json

      # ════════════════════════════════════════════════════════════════════════
      # 5. VERIFY RELEASE STATE
      # ════════════════════════════════════════════════════════════════════════
      - name: Validate release state
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import sys

          with open("release.json", "r", encoding="utf-8") as f:
              release = json.load(f)

          tag = os.environ["TAG_NAME"]

          if release.get("tagName") != tag:
              print(
                  f"ERROR: release tag mismatch: "
                  f"{release.get('tagName')!r} != {tag!r}",
                  file=sys.stderr,
              )
              sys.exit(1)

          if release.get("isDraft"):
              print("ERROR: release is still a draft.", file=sys.stderr)
              sys.exit(1)

          if not release.get("publishedAt"):
              print(
                  "ERROR: release does not have a published timestamp.",
                  file=sys.stderr,
              )
              sys.exit(1)

          print("Release metadata is valid.")
          print(f"Tag        : {release['tagName']}")
          print(f"Published  : {release['publishedAt']}")
          print(f"Prerelease : {release.get('isPrerelease')}")
          print(f"URL        : {release.get('url')}")

          assets = release.get("assets", [])

          if not assets:
              print(
                  "ERROR: published release contains no assets.",
                  file=sys.stderr,
              )
              sys.exit(1)

          print("Assets:")
          for asset in assets:
              print(
                  f"  - {asset.get('name')} "
                  f"({asset.get('size')} bytes)"
              )
          PY

      # ════════════════════════════════════════════════════════════════════════
      # 6. VERIFY DISTRIBUTION ASSETS
      # ════════════════════════════════════════════════════════════════════════
      - name: Verify Python distribution assets
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import sys

          with open("release.json", "r", encoding="utf-8") as f:
              release = json.load(f)

          assets = [a["name"] for a in release.get("assets", [])]

          wheels = [
              name
              for name in assets
              if name.endswith(".whl")
          ]

          sdists = [
              name
              for name in assets
              if name.endswith(".tar.gz")
          ]

          if not wheels:
              print(
                  "ERROR: no Python wheel found in published release.",
                  file=sys.stderr,
              )
              sys.exit(1)

          if not sdists:
              print(
                  "ERROR: no Python source distribution found in "
                  "published release.",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"Wheels : {len(wheels)}")
          print(f"Sdist  : {len(sdists)}")

          for name in wheels:
              print(f"  wheel: {name}")

          for name in sdists:
              print(f"  sdist: {name}")
          PY

      # ════════════════════════════════════════════════════════════════════════
      # 7. DOWNLOAD RELEASE ASSETS
      # ════════════════════════════════════════════════════════════════════════
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets

          gh release download "${TAG_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir release-assets \
            --pattern "*.whl" \
            --pattern "*.tar.gz" \
            --clobber

          if ! find release-assets -type f -print -quit | grep -q .; then
            echo "::error::No Python distribution assets were downloaded."
            exit 1
          fi

          find release-assets -maxdepth 1 -type f -print

      # ════════════════════════════════════════════════════════════════════════
      # 8. HASH RELEASE ARTIFACTS
      # ════════════════════════════════════════════════════════════════════════
      - name: Generate release artifact hashes
        shell: bash
        run: |
          set -euo pipefail

          cd release-assets

          find . \
            -maxdepth 1 \
            -type f \
            \( -name "*.whl" -o -name "*.tar.gz" \) \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > ../release-sha256.txt

          echo "Release artifact SHA-256:"
          cat ../release-sha256.txt

      # ════════════════════════════════════════════════════════════════════════
      # 9. VERIFY PROVENANCE ASSET
      # ════════════════════════════════════════════════════════════════════════
      #
      # SLSA provenance is expected to be attached by the SLSA workflow.
      #
      # We deliberately make this an explicit verification step rather than
      # silently treating its absence as success.
      #
      # ════════════════════════════════════════════════════════════════════════
      - name: Verify SLSA provenance asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p provenance

          gh release download "${TAG_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir provenance \
            --pattern "*.intoto.jsonl" \
            --clobber

          if ! find provenance -type f -name "*.intoto.jsonl" -print -quit | grep -q .; then
            echo "::error::No SLSA/in-toto provenance asset was found."
            exit 1
          fi

          echo "SLSA provenance asset(s):"
          find provenance -type f -name "*.intoto.jsonl" -print

      # ════════════════════════════════════════════════════════════════════════
      # 10. PUBLISH VERIFICATION EVIDENCE
      # ════════════════════════════════════════════════════════════════════════
      - name: Upload release verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-integrity-${{ steps.release.outputs.tag_name }}
          path: |
            release.json
            release-sha256.txt
            provenance/
          if-no-files-found: error
          retention-days: 30

      # ════════════════════════════════════════════════════════════════════════
      # 11. FINAL RELEASE VERDICT
      # ════════════════════════════════════════════════════════════════════════
      - name: Final release integrity verdict
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "════════════════════════════════════════════════════════════════"
          echo "SERAPH GUARD — RELEASE INTEGRITY: PASS"
          echo "════════════════════════════════════════════════════════════════"
          echo
          echo "Release tag       : ${TAG_NAME}"
          echo "Git tag verified  : YES"
          echo "Release published : YES"
          echo "Python artifacts  : YES"
          echo "SHA-256 generated : YES"
          echo "SLSA provenance   : YES"
          echo
          echo "Canonical publisher:"
          echo "  .github/workflows/ci.yml"
          echo
          echo "Provenance:"
          echo "  .github/workflows/slsa-generator-generic.yml"
          echo
          echo "Verification:"
          echo "  .github/workflows/release.yml"
          echo
          echo "════════════════════════════════════════════════════════════════"