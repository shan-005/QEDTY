# ═══════════════════════════════════════════════════════════════════════════════
# setuptools
# ═══════════════════════════════════════════════════════════════════════════════

[tool.setuptools]

include-package-data = true
zip-safe = false


[tool.setuptools.packages.find]

where = [
    "src",
]

include = [
    "seraph*",
]

exclude = [
    "tests*",
    "docs*",
    "benchmarks*",
    "scripts*",
]

namespaces = true


[tool.setuptools.package-dir]

"" = "src"


[tool.setuptools.package-data]

"seraph" = [
    "py.typed",
    "schemas/*.json",
    "config/*.yaml",
]


# ═══════════════════════════════════════════════════════════════════════════════
# setuptools-scm
# ═══════════════════════════════════════════════════════════════════════════════
#
# IMPORTANT:
#
# Use non-strict local versioning here so development worktrees can build.
#
# The previous setting:
#
#     local_scheme = "no-local-version-strict"
#
# causes:
#
#     DirtyWorkingTreeError: Working tree has uncommitted changes
#
# whenever the repository has uncommitted changes.
#
# That is appropriate for a release gate, but not for normal development,
# editable installs, uv lock, uv sync, pytest, or local build verification.
#
# Release CI should enforce clean builds separately, for example:
#
#     if [ -n "$(git status --porcelain)" ]; then
#         echo "Release builds must come from a clean checkout"
#         exit 1
#     fi
#
# ═══════════════════════════════════════════════════════════════════════════════

[tool.setuptools_scm]

version_file = "src/seraph/_version.py"

version_scheme = "semver-pep440-release-branch"

# Non-strict: allows dirty development worktrees.
# It still removes local dirty markers from the public version.
local_scheme = "no-local-version"

fallback_version = "0.3.0.dev0"

relative_to = "pyproject.toml"


# ═══════════════════════════════════════════════════════════════════════════════
# uv
# ═══════════════════════════════════════════════════════════════════════════════

[tool.uv]

# CI currently pins uv 0.12.23.
# Keep the project contract aligned with CI.
required-version = "==0.12.23"

default-groups = [
    "dev",
]

python-preference = "only-managed"

managed = true

resolution = "highest"

prerelease = "disallow"

# First-index prevents dependency-confusion behavior when additional indexes
# are introduced later.
index-strategy = "first-index"

# Generate .pyc files during sync/run to improve repeated startup behavior.
compile-bytecode = true


[tool.uv.pip]

# When uv pip compile/export is used, preserve hashes where supported.
generate-hashes = true


# ═══════════════════════════════════════════════════════════════════════════════
# Poe Task Runner
# ═══════════════════════════════════════════════════════════════════════════════

[tool.poe.tasks]

test = "pytest -xvs"

test-cov = "pytest --cov=seraph --cov-report=term-missing"

lint = "ruff check src tests"

lint-fix = "ruff check --fix src tests"

format = "ruff format src tests"

typecheck = "mypy src --strict"

security = "bandit -r src"

audit = "pip-audit --desc"

build = "python -m build"

clean = "rm -rf build dist *.egg-info .pytest_cache .mypy_cache .ruff_cache htmlcov"

# Quote the extra expression so shells do not interpret [all] as a glob.
install-all = "pip install -e '.[all]'"


# ═══════════════════════════════════════════════════════════════════════════════
# Nox
# ═══════════════════════════════════════════════════════════════════════════════

[tool.nox]

sessions = [
    "lint",
    "typecheck",
    "test",
    "security",
]


# ═══════════════════════════════════════════════════════════════════════════════
# Ruff
# ═══════════════════════════════════════════════════════════════════════════════

[tool.ruff]

line-length = 100

target-version = "py312"

src = [
    "src",
    "tests",
]

extend-exclude = [
    "target_app",
    ".venv",
    ".seraph-cache",
    ".seraph-learn",
    "build",
    "dist",
    "*.egg-info",
    ".git",
    ".github",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "htmlcov",
    "site",
    "uv.lock",
    "src/seraph/_version.py",
]


[tool.ruff.lint]

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*?)|dummy|unused|ignored)$"

task-tags = [
    "TODO",
    "FIXME",
    "HACK",
    "XXX",
    "NOTE",
