[tool.ruff.lint.flake8-tidy-imports]

ban-relative-imports = "parents"


[tool.ruff.lint.flake8-type-checking]

strict = true

exempt-modules = [
    "typing",
    "typing_extensions",
    "collections.abc",
]


[tool.ruff.lint.mccabe]

max-complexity = 12


[tool.ruff.lint.pep8-naming]

classmethod-decorators = [
    "classmethod",
    "pydantic.validator",
    "pydantic.field_validator",
]

staticmethod-decorators = [
    "staticmethod",
]

ignore-names = [
    "setUp",
    "tearDown",
    "setUpClass",
    "tearDownClass",
    "asyncSetUp",
    "asyncTearDown",
]


[tool.ruff.lint.isort]

known-first-party = [
    "seraph",
]

known-third-party = [
    "click",
    "rich",
    "pydantic",
    "httpx",
    "yaml",
    "jinja2",
    "cvss",
    "tree_sitter",
    "tree_sitter_languages",
    "pygls",
    "lsprotocol",
    "hcl2",
    "networkx",
    "defusedxml",
]

combine-as-imports = true

split-on-trailing-comma = true

lines-after-imports = 2

lines-between-types = 1

order-by-type = true

case-sensitive = true

detect-same-package = true

force-sort-within-sections = false


[tool.ruff.format]

quote-style = "double"

indent-style = "space"

skip-magic-trailing-comma = false

line-ending = "auto"

docstring-code-format = true

docstring-code-line-length = 80


# ═══════════════════════════════════════════════════════════════════════════════
# mypy
# ═══════════════════════════════════════════════════════════════════════════════

[tool.mypy]

python_version = "3.12"

strict = true

warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_no_return = true
warn_unreachable = true
warn_incomplete_stub = true
check_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
strict_equality = true
implicit_reexport = false
show_error_codes = true
show_column_numbers = true
hide_error_codes = false
pretty = true
color_output = true
error_summary = true
extra_checks = true

enable_error_code = [
    "ignore-without-code",
    "truthy-bool",
    "unused-awaitable",
    "possibly-undefined",
    "mutable-override",
    "explicit-override",
    "narrowed-type-not-subtype",
    "unused-ignore",
    "unused-coroutine",
]

follow_imports = "normal"

cache_dir = ".mypy_cache"

sqlite_cache = true

plugins = [
    "pydantic.mypy",
]


[[tool.mypy.overrides]]

module = [
    "rich.*",
    "click.*",
    "yaml.*",
    "jinja2.*",
    "httpx.*",
    "aiofiles.*",
    "tree_sitter",
    "tree_sitter.*",
    "tree_sitter_languages",
    "hcl2",
    "pygls.*",
    "lsprotocol.*",
    "networkx.*",
    "cvss",
    "cvss.*",
]

ignore_missing_imports = true


[[tool.mypy.overrides]]

module = [
    "seraph._version",
]

ignore_missing_imports = true

follow_imports = "skip"


[[tool.mypy.overrides]]

module = [
    "tests.*",
]

disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false


[tool.pydantic-mypy]

init_forbid_extra = true
init_typed = true


# ═══════════════════════════════════════════════════════════════════════════════
# Pyright / BasedPyright
# ═══════════════════════════════════════════════════════════════════════════════

[tool.pyright]

include = [
    "src",
]

exclude = [
    "build",
    "dist",
    ".venv",
    "tests",
    "**/__pycache__",
]

pythonVersion = "3.12"

pythonPlatform = "All"

typeCheckingMode = "strict"

reportMissingImports = true
reportMissingTypeStubs = true
reportUntypedFunctionDecorator = true
reportUntypedClassDecorator = true
reportPrivateUsage = "warning"
reportCallInDefaultInitializer = "warning"
reportPropertyTypeMismatch = "error"
reportUninitializedInstanceVariable = "error"
reportMissingSuperCall = "warning"
reportImplicitStringConcatenation = "warning"
reportMissingTypeArgument = "error"
reportInvalidTypeVarUse = "error"
reportUnknownParameterType = "error"
reportUnknownArgumentType = "error"
reportUnknownLambdaType = "error"
reportUnknownMemberType = "error"
reportUnknownVariableType = "error"
reportMissingParameterType = "error"
reportUnnecessaryIsInstance = "warning"
reportUnnecessaryCast = "warning"
reportUnnecessaryComparison = "warning"
reportUnnecessaryContains = "warning"
reportAssertAlwaysTrue = "warning"
reportSelfClsParameterName = "error"
reportImplicitOverride = "error"
reportShadowedImports = "warning"

strictListInference = true
strictDictionaryInference = true
strictSetInference = true


[tool.basedpyright]

include = [
    "src",
]

exclude = [
    "build",
    "dist",
    ".venv",
    "tests",
    "**/__pycache__",
]

pythonVersion = "3.12"

pythonPlatform = "All"

typeCheckingMode = "all"

reportMissingImports = true
reportMissingTypeStubs = true
reportPrivateUsage = "warning"
reportPropertyTypeMismatch = "error"
reportUninitializedInstanceVariable = "error"
reportMissingSuperCall = "warning"
reportImplicitStringConcatenation = "warning"
reportMissingTypeArgument = "error"
reportInvalidTypeVarUse = "error"
reportUnknownParameterType = "error"
reportUnknownArgumentType = "error"
reportUnknownLambdaType = "error"
reportUnknownMemberType = "error"
reportUnknownVariableType = "error"
reportMissingParameterType = "error"
reportUnnecessaryIsInstance = "warning"
reportUnnecessaryCast = "warning"
reportUnnecessaryComparison = "warning"
reportUnnecessaryContains = "warning"
reportAssertAlwaysTrue = "warning"
reportSelfClsParameterName = "error"
reportImplicitOverride = "error"
reportShadowedImports = "warning"
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
reportDeprecated = "warning"
reportIgnoreCommentWithoutRule = "error"
reportInvalidCast = "error"
reportInvalidAbstractMethod = "error"
reportInvalidOverride = "error"
reportMissingModuleSource = "warning"
reportRedundantExpression = "warning"
reportUnnecessaryAssignment = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"
reportUnusedCallResult = "warning"
reportUnusedExpression = "warning"
reportWildcardImportFromLibrary = "error"


# ═══════════════════════════════════════════════════════════════════════════════
# pytest
# ═══════════════════════════════════════════════════════════════════════════════

[tool.pytest.ini_options]

minversion = "9.0"

testpaths = [
    "tests",
]

python_files = [
    "test_*.py",
]

python_classes = [
    "Test*",
]

python_functions = [
    "test_*",
]

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-v",
    "--tb=short",
    "--disable-warnings",
]

asyncio_mode = "auto"

asyncio_default_fixture_loop_scope = "function"

xfail_strict = true

log_cli = true

log_cli_level = "INFO"

log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"

log_cli_date_format = "%Y-%m-%d %H:%M:%S"

log_file = "logs/pytest.log"

log_file_level = "DEBUG"

log_file_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"

log_file_date_format = "%Y-%m-%d %H:%M:%S"

norecursedirs = [
    ".git",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
    "node_modules",
]

cache_dir = ".pytest_cache"

console_output_style = "progress-even-when-capture-no"

faulthandler_timeout = 60

tmp_path_retention_count = 3

tmp_path_retention_policy = "failed"

markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "network: marks tests that require network access",
    "security: marks tests that test security features",
    "benchmark: marks tests that are benchmarks",
    "flaky: marks tests as flaky",
    "lsp: marks tests that require LSP dependencies",
    "ast: marks tests that require tree-sitter dependencies",
]

filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning:pkg_resources.*",
    "ignore::DeprecationWarning:deprecated.*",
    "ignore::DeprecationWarning:pytest_asyncio.*",
    "ignore:.*get_event_loop_policy.*:DeprecationWarning",
]


# ═══════════════════════════════════════════════════════════════════════════════
# Coverage
# ═══════════════════════════════════════════════════════════════════════════════

[tool.coverage.run]

source = [
    "src/seraph",
]

branch = true

parallel = true

relative_files = true

sigterm = true

concurrency = [
    "thread",
]

data_file = ".coverage/.coverage"

omit = [
    "tests/*",
    "**/__init__.py",
    "**/__main__.py",
    "src/seraph/_version.py",

    "src/seraph/integrations/lsp/*",
    "src/seraph/sources/repository/scanners/container.py",
    "src/seraph/output/dashboard/*",
    "src/seraph/output/dashboard.py",

    "src/seraph/intelligence/explanation/*",
    "src/seraph/output/panels.py",
    "src/seraph/output/styles.py",
    "src/seraph/output/formatters/*",


    "src/seraph/sources/repository/scanners/utils.py",
    "src/seraph/intelligence/ufic/findings.py",
]


[tool.coverage.paths]

source = [
    "src",
    "*/site-packages",
]


[tool.coverage.report]

show_missing = true

skip_covered = false

skip_empty = true

# Do not claim a coverage threshold that the project has not demonstrated.
fail_under = 0

precision = 2

sort = "-cover"

exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
    "pass",
    "\\.\\.\\.",
    "class .*\\bProtocol\\):",
    "@overload",
    "typing.overload",
]


[tool.coverage.html]

directory = "htmlcov"

title = "Seraph Coverage Report"

show_contexts = false


[tool.coverage.xml]

output = "coverage.xml"


[tool.coverage.json]

output = "coverage.json"

pretty_print = true


# ═══════════════════════════════════════════════════════════════════════════════
# Security & Quality Tools
# ═══════════════════════════════════════════════════════════════════════════════

[tool.bandit]

exclude_dirs = [
    "tests",
    ".venv",
    "build",
    "dist",
    "scripts",
    "benchmarks",
]

skips = [
    "B101",
]

targets = [
    "src",
]

severity = "medium"

confidence = "medium"

ignore_nosec = false

verbose = false


[tool.pip-audit]


[tool.vulture]

exclude = [
    "tests/",
    ".venv/",
    "build/",
    "dist/",
]

ignore_decorators = [
    "@pytest.fixture",
    "@pytest_asyncio.fixture",
]

ignore_names = [
    "setUp*",
    "tearDown*",
    "asyncSetUp*",
    "asyncTearDown*",
]

make_whitelist = true

min_confidence = 80

paths = [
    "src/seraph",
]


[tool.check-manifest]

ignore = [
    "src/seraph/_version.py",
]


[tool.deptry]

ignore = [
]

ignore_notebooks = true


[tool.deptry.package_module_name_map]

python-hcl2 = "hcl2"


[tool.interrogate]

ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
ignore-property-decorators = true
ignore-module = true
ignore-nested-functions = true
ignore-nested-classes = true
ignore-setters = true

fail-under = 80

exclude = [
    "tests",
    "docs",
    "build",
    "dist",
    ".venv",
]

verbose = 2
quiet = false

whitelist-regex = [
    "^_.*",
]


[tool.codespell]

skip = ".git,.venv,build,dist,*.egg-info,node_modules,htmlcov,.pytest_cache,.mypy_cache,.ruff_cache,uv.lock"

ignore-words-list = "seraph,teh,nd"

quiet-level = 2

check-filenames = true
check-hidden = true


# ═══════════════════════════════════════════════════════════════════════════════
# Release & Documentation
# ═══════════════════════════════════════════════════════════════════════════════

[tool.commitizen]

name = "cz_conventional_commits"

tag_format = "v$version"

version_scheme = "pep440"

version_provider = "scm"

update_changelog_on_bump = true

changelog_incremental = true

changelog_start_rev = "v0.1.0"


[tool.mkdocs]

site_name = "Seraph Documentation"

site_description = "Seraph — a planetary continuity intelligence platform with repository security evidence capabilities"

site_author = "IRIN-0"

docs_dir = "docs"

site_dir = "site"