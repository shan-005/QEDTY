[build-system]
requires = [
  "setuptools>=80,<82",
  "setuptools-scm>=9,<10",
  "wheel>=0.46,<1",
]
build-backend = "setuptools.build_meta"

[project]
name = "qedty"
dynamic = ["version"]
description = "QEDTY — evidence-backed planetary continuity intelligence"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "shan-005"}]
keywords = [
  "planetary-continuity",
  "world-model",
  "temporal-graph",
  "geospatial-intelligence",
  "space-intelligence",
  "gnss",
  "critical-infrastructure",
  "supply-chain",
  "economic-intelligence",
  "counterfactual",
  "resilience",
  "uncertainty",
  "provenance",
  "scenario-analysis",
  "data-engineering",
  "knowledge-graph",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "orjson>=3.12,<4",
  "httpx>=0.28.1,<1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "jsonschema>=4.25,<5",
  "python-dateutil>=2.9,<3",
  "tenacity>=9.1,<10",
  "platformdirs>=4.3,<5",
]

[project.optional-dependencies]
cli = [
  "typer>=0.27,<1",
  "rich>=15,<16",
]
api = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.35,<1",
]
rpc = [
  "protobuf>=7.36,<8",
  "grpcio>=1.75,<2",
  "grpcio-tools>=1.75,<2",
  "grpcio-health-checking>=1.75,<2",
]
geo = [
  "shapely>=2.2,<3",
  "pyproj>=3.7,<4",
  "pyogrio>=0.13,<1",
  "rasterio>=1.5,<2",
  "geopandas>=1.2,<2",
  "h3>=4.5,<5",
]
science = [
  "numpy>=2.5,<3",
  "scipy>=1.18,<2",
]
space = [
  "astropy>=8.0,<9",
  "sgp4>=2.27,<3",
]
rdf = [
  "rdflib>=7.6,<8",
]
security = [
  "cryptography>=50,<51",
  "tree-sitter>=0.26,<1",
]
arrow = [
  "pyarrow>=25,<26",
]
analytics = [
  "pyarrow>=25,<26",
  "duckdb>=1.5,<2",
  "datafusion>=54,<55",
  "polars>=2,<3",
]
database = [
  "SQLAlchemy>=2.1,<3",
  "psycopg[binary,pool]>=3.3,<4",
  "asyncpg>=0.32,<1",
  "redis>=8.1,<9",
]
ingest = [
  "aiohttp>=3.14,<4",
  "fsspec>=2026.9,<2027",
  "s3fs>=2026.9,<2027",
  "ijson>=3.5,<4",
  "zstandard>=0.25,<1",
]
observability = [
  "opentelemetry-api>=1.45.0,<1.45.1",
  "opentelemetry-sdk>=1.45.0,<1.45.1",
  "opentelemetry-exporter-otlp>=1.45.0,<1.45.1",
  "prometheus-client>=0.22,<1",
  "structlog>=25,<26",
]
ml = [
  "scikit-learn>=1.9,<2",
]
native = [
  "maturin>=1.9,<2",
]
all = [
  "typer>=0.27,<1",
  "rich>=15,<16",
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.35,<1",
  "protobuf>=7.36,<8",
  "grpcio>=1.75,<2",
  "grpcio-tools>=1.75,<2",
  "grpcio-health-checking>=1.75,<2",
  "shapely>=2.2,<3",
  "pyproj>=3.7,<4",
  "pyogrio>=0.13,<1",
  "rasterio>=1.5,<2",
  "geopandas>=1.2,<2",
  "h3>=4.5,<5",
  "numpy>=2.5,<3",
  "scipy>=1.18,<2",
  "astropy>=8.0,<9",
  "sgp4>=2.27,<3",
  "rdflib>=7.6,<8",
  "cryptography>=50,<51",
  "tree-sitter>=0.26,<1",
  "pyarrow>=25,<26",
  "duckdb>=1.5,<2",
  "datafusion>=54,<55",
  "polars>=2,<3",
  "SQLAlchemy>=2.1,<3",
  "psycopg[binary,pool]>=3.3,<4",
  "asyncpg>=0.32,<1",
  "redis>=8.1,<9",
  "aiohttp>=3.14,<4",
  "fsspec>=2026.9,<2027",
  "s3fs>=2026.9,<2027",
  "ijson>=3.5,<4",
  "zstandard>=0.25,<1",
  "opentelemetry-api>=1.45.0,<1.45.1",
  "opentelemetry-sdk>=1.45.0,<1.45.1",
  "opentelemetry-exporter-otlp>=1.45.0,<1.45.1",
  "prometheus-client>=0.22,<1",
  "structlog>=25,<26",
  "scikit-learn>=1.9,<2",
]

[project.urls]
Homepage = "https://github.com/shan-005/QEDTY"
Repository = "https://github.com/shan-005/QEDTY"
Documentation = "https://github.com/shan-005/QEDTY/tree/main/docs"
Issues = "https://github.com/shan-005/QEDTY/issues"

[project.scripts]
qedty = "qedty.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["qedty*"]

[tool.setuptools.package-data]
qedty = [
  "py.typed",
  "schemas/*.json",
  "schemas/**/*.json",
]

[tool.setuptools_scm]
version_file = "src/qedty/_version.py"
fallback_version = "0.0.1a1"
local_scheme = "no-local-version"

[tool.uv]
required-version = ">=0.12.23,<0.13"
default-groups = ["dev"]
python-preference = "only-managed"
python-downloads = "automatic"
managed = true
resolution = "highest"
prerelease = "if-necessary"
prerelease-package = { opentelemetry-exporter-otlp-common = "allow", opentelemetry-semantic-conventions = "allow" }
index-strategy = "first-index"
compile-bytecode = true

[dependency-groups]
test = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=7,<8",
  "pytest-asyncio>=1.4,<2",
  "hypothesis>=6.168,<7",
  "freezegun>=1.5,<2",
  "jsonschema>=4.25,<5",
  "pytest-xdist>=3.8,<4",
  "pytest-timeout>=2.4,<3",
  "pytest-benchmark>=5.2,<6",
  "respx>=0.22,<1",
]
lint = [
  "ruff>=0.16.8,<0.17",
  "codespell>=2.4.3,<3",
  "pre-commit>=4.3,<5",
  "validate-pyproject>=0.24,<1",
]
types = [
  "mypy>=2.4,<3",
  "basedpyright>=1.39,<2",
  "types-shapely>=2.0,<3",
]
security = [
  "bandit>=1.9,<2",
  "pip-audit>=2.10,<3",
]
package = [
  "build>=1.3,<2",
  "twine>=6,<8",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.6,<10",
  "mkdocstrings>=0.29,<1",
  "mkdocstrings-python>=1.16,<2",
]
native = [
  "maturin>=1.9,<2",
]
integration = [
  "testcontainers>=4.10,<5",
  "SQLAlchemy>=2.1,<3",
  "psycopg[binary,pool]>=3.3,<4",
  "asyncpg>=0.32,<1",
  "redis>=8.1,<9",
]
data = [
  "pyarrow>=25,<26",
  "duckdb>=1.5,<2",
  "datafusion>=54,<55",
  "polars>=2,<3",
  "fsspec>=2026.9,<2027",
  "s3fs>=2026.9,<2027",
  "ijson>=3.5,<4",
  "zstandard>=0.25,<1",
]
space = [
  "astropy>=8,<9",
  "sgp4>=2.27,<3",
]
geo = [
  "shapely>=2.2,<3",
  "pyproj>=3.7,<4",
  "pyogrio>=0.13,<1",
  "rasterio>=1.5,<2",
  "geopandas>=1.2,<2",
  "h3>=4.5,<5",
]
api = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.35,<1",
  "protobuf>=7.36,<8",
  "grpcio>=1.75,<2",
  "grpcio-tools>=1.75,<2",
  "grpcio-health-checking>=1.75,<2",
]
observability = [
  "opentelemetry-api>=1.45.0,<1.45.1",
  "opentelemetry-sdk>=1.45.0,<1.45.1",
  "opentelemetry-exporter-otlp>=1.45.0,<1.45.1",
  "prometheus-client>=0.22,<1",
  "structlog>=25,<26",
]
dev = [
  {include-group = "test"},
  {include-group = "lint"},
  {include-group = "types"},
  {include-group = "security"},
  {include-group = "package"},
  {include-group = "docs"},
  {include-group = "native"},
  {include-group = "integration"},
  {include-group = "data"},
  {include-group = "space"},
  {include-group = "geo"},
  {include-group = "api"},
  {include-group = "observability"},
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
exclude = [
  "src/qedty/_version.py",
  ".venv",
  "build",
  "dist",
  "target",
  ".git",
  ".pytest_cache",
  ".mypy_cache",
  ".ruff_cache",
  "__pycache__",
]
respect-gitignore = true

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RUF",
  "TCH", "PTH", "PERF", "FURB",
]
ignore = [
  "E501",
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["qedty"]
combine-as-imports = true
force-wrap-aliases = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["TCH001", "TCH002", "TCH003"]
"scripts/**/*.py" = ["TCH001", "TCH002", "TCH003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/qedty"]
mypy_path = ["src"]
warn_unreachable = true
warn_unused_ignores = true
warn_unused_configs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
exclude = "(^|/)(build|dist|\\.venv|target)(/|$)"

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src/qedty"]
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
  "build",
  "dist",
  "target",
  ".venv",
  "src/qedty/_version.py",
]
executionEnvironments = [
  {root = "src", extraPaths = ["src"]},
]
reportAny = false
reportExplicitAny = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnusedCallResult = false
reportUnannotatedClassAttribute = false
reportImplicitStringConcatenation = false
reportMissingTypeStubs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=qedty",
  "--cov-report=term-missing",
]
asyncio_mode = "auto"
xfail_strict = true
timeout = 300
junit_family = "xunit2"
markers = [
  "unit: deterministic unit tests",
  "integration: cross-module integration tests",
  "slow: intentionally slower tests",
  "conformance: contract and golden-vector conformance",
  "property: property-based tests",
  "security: security-sensitive behavior",
  "performance: performance and benchmark tests",
  "external: tests requiring external services or datasets",
]

[tool.coverage.run]
branch = true
parallel = true
relative_files = true
source = ["qedty"]

[tool.coverage.report]
show_missing = true
skip_empty = true
skip_covered = true
precision = 2
fail_under = 26
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]

[tool.bandit]
exclude_dirs = [
  "tests",
  ".venv",
  "build",
  "dist",
  "target",
]
skips = ["B101", "B105"]