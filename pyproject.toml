    "packaging>=26.3,<27.0",
    "orjson>=3.12.0,<4.0.0",
    "structlog>=26.1.0,<27.0.0",

    # LSP runtime.
    "pygls>=2.1.1,<3.0.0",
    "lsprotocol>=2025.0.0,<2026.0.0",

    # Secure XML parsing.
