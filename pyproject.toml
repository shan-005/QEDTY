[build-system]
requires = [
  "setuptools>=84.0.0,<85.0.0",
  "setuptools-scm>=10.3.4,<11.0.0",
  "wheel>=0.48.0,<1.0.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "seraph-pci-x"
dynamic = ["version"]
description = "SERAPH-PCI-X — evidence-backed planetary continuity intelligence across space, geospatial systems, infrastructure and economics"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
authors = [{name = "IRIN-0"}]
keywords = [
  "planetary-continuity", "world-model", "temporal-graph", "geospatial-intelligence",
  "space-intelligence", "gnss", "critical-infrastructure", "supply-chain",
  "economic-intelligence", "counterfactual", "resilience", "uncertainty",
  "provenance", "scenario-analysis"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.13.5,<3.0.0",
  "orjson>=3.12.0,<4.0.0",
  "httpx>=0.28.1,<1.0.0",
]

[project.optional-dependencies]
geo = [
  "shapely>=2.1.0,<3.0.0",
  "pyproj>=3.8.0,<4.0.0",
]
science = [
  "numpy>=2.5.3,<3.0.0",
  "scipy>=1.18.1,<2.0.0",
]
api = [
  "fastapi>=0.142.2,<1.0.0",
  "uvicorn[standard]>=0.54.0,<1.0.0",
]
security = [
  "tree-sitter>=0.26.0,<1.0.0",
]
all = [
  "shapely>=2.1.0,<3.0.0",
  "pyproj>=3.8.0,<4.0.0",
  "numpy>=2.5.3,<3.0.0",
  "scipy>=1.18.1,<2.0.0",
  "fastapi>=0.142.2,<1.0.0",
  "uvicorn[standard]>=0.54.0,<1.0.0",
  "tree-sitter>=0.26.0,<1.0.0",
]

[project.urls]
Repository = "https://github.com/IRIN-0/seraph"
Issues = "https://github.com/IRIN-0/seraph/issues"

[project.scripts]
seraph = "seraph.cli.main:main"
seraph-pci = "seraph.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["seraph*"]

[tool.setuptools.package-data]
seraph = ["py.typed", "schemas/*.json"]

[tool.setuptools_scm]
version_file = "src/seraph/_version.py"
fallback_version = "0.4.0.dev0"
local_scheme = "no-local-version"
relative_to = "pyproject.toml"

[tool.uv]
required-version = ">=0.12.23,<0.13.0"
default-groups = ["dev"]
python-preference = "only-managed"
managed = true
resolution = "highest"
prerelease = "disallow"
index-strategy = "first-index"
compile-bytecode = true

[dependency-groups]
test = [
  "pytest>=9.1.1,<10.0.0",
  "pytest-cov>=7.1.0,<8.0.0",
  "pytest-asyncio>=1.4.0,<2.0.0",
  "hypothesis>=6.168.4,<7.0.0",
  "freezegun>=1.5.5,<2.0.0",
]
lint = [
  "ruff>=0.16.10,<0.17.0",
  "codespell>=2.4.3,<3.0.0",
]
types = [
  "mypy>=2.4.0,<3.0.0",
  "basedpyright>=1.40.2,<2.0.0",
]
security = [
  "bandit>=1.9.4,<2.0.0",
  "pip-audit>=2.10.1,<3.0.0",
]
package = [
  "build>=1.6.1,<2.0.0",
  "twine>=7.0.0,<8.0.0",
]
dev = [
  {include-group = "test"},
  {include-group = "lint"},
  {include-group = "types"},
  {include-group = "security"},
  {include-group = "package"},
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = "(^|/)(build|dist|\\.venv)(/|$)"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
  "unit: deterministic unit test",
  "integration: cross-module integration test",
  "slow: intentionally slower test",
]

[tool.coverage.run]
branch = true
source = ["seraph"]

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = ["B101"]
