# ═══════════════════════════════════════════════════════════════════════════════
# SERAPH-PCI-X — pyproject.toml v7.0.0
# Production-grade packaging, dependency governance & supply-chain configuration
# ═══════════════════════════════════════════════════════════════════════════════
#
# Standards / design:
#   - PEP 621  : project metadata
#   - PEP 639  : SPDX license expression + license files
#   - PEP 735  : dependency groups
#   - PEP 440  : public version normalization
#   - PEP 517  : isolated build backend
#   - PEP 518  : build-system declaration
#
# Packaging architecture:
#
#   Git tag
#      │
#      ▼
#   setuptools-scm
#      │
#      ├── exact release version
#      ├── development version
#      └── generated src/seraph/_version.py
#              │
#              ▼
#        setuptools build backend
#              │
#        ┌─────┴─────┐
#        ▼           ▼
#      wheel        sdist
#        │           │
#        └──────────┘
#              ▼
#       CI artifact hashes
#              │
#              ▼
#       GitHub attestation
#              │
#              ▼
#       SLSA provenance
#
# IMPORTANT:
#   CI/release workflows must build the exact artifacts that are subsequently
#   attested and published. A second independent rebuild must NOT become the
#   release artifact.
#
# DEVELOPMENT vs RELEASE:
#   This file uses non-strict local versioning so that dirty development
#   worktrees can still run:
#
#       uv lock
#       uv sync
#       uv run pytest
#       python -m build
#
#   Release CI must enforce cleanliness separately, for example:
#
#       test -z "$(git status --porcelain)"
#
#   or build only from a tagged clean checkout.
# ═══════════════════════════════════════════════════════════════════════════════


# ──────────────────────────────────────────────────────────────────────────────
# Build System
# ──────────────────────────────────────────────────────────────────────────────

[build-system]

requires = [
    "setuptools>=84.0.0,<85.0.0",
    "setuptools-scm>=10.3.4,<11.0.0",
    "wheel>=0.48.0,<1.0.0",
]

build-backend = "setuptools.build_meta"


# ──────────────────────────────────────────────────────────────────────────────
# Project Metadata
# ──────────────────────────────────────────────────────────────────────────────

[project]

name = "seraph-pci-x"

dynamic = [
    "version",
]

description = "SERAPH-PCI-X — evidence-backed planetary continuity intelligence across space, infrastructure, economic systems, and repository security"

readme = "README.md"

requires-python = ">=3.12,<3.15"

# PEP 639 / SPDX license expression.
license = "Apache-2.0"

# Keep the SPDX expression in metadata. The repository must add a matching
# LICENSE file before a public release; do not advertise a license that is
# not actually shipped with the source distribution.

authors = [
    { name = "IRIN-0" },
]

maintainers = [
    { name = "IRIN-0" },
]

keywords = [
    "planetary-continuity",
    "critical-infrastructure",
    "space-intelligence",
    "satellite",
    "gnss",
    "geospatial",
    "temporal-graph",
    "shock-propagation",
    "resilience",
    "economic-intelligence",
    "counterfactual",
    "evidence-provenance",
    "security",
    "devsecops",
    "vulnerability-scanner",
    "secret-detection",
    "sbom",
    "software-bill-of-materials",
    "policy-as-code",
