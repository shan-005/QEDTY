syntax = "proto3";

package qedty.scenarios.v1;

message StatePatch {
  string entity_id = 1;
  string path = 2;
  string operation = 3;
  string json_value = 4;
  string reason = 5;
}

message Shock {
  string shock_id = 1;
  string name = 2;
  string event_type = 3;
  string source_entity_id = 4;
  string starts_at = 5;
  string ends_at = 6;
  double severity = 7;
  string epistemic_status = 8;
  repeated string target_entity_ids = 9;
  map<string,double> capacity_multipliers = 10;
  repeated StatePatch patches = 11;
}

message Intervention {
  string intervention_id = 1;
  string name = 2;
  string intervention_type = 3;
  double cost_usd = 4;
  repeated string protected_entity_ids = 5;
  double transmission_reduction = 6;
  double capacity_gain = 7;
  string activation_at = 8;
  string deactivation_at = 9;
  repeated StatePatch patches = 10;
}

message Scenario {
  string scenario_id = 1;
  string name = 2;
  string description = 3;
  string kind = 4;
  string status = 5;
  string parent_scenario_id = 6;
  string base_world_digest = 7;
  string base_state_digest = 8;
  string epistemic_status = 9;
  repeated string assumptions = 10;
  repeated string tags = 11;
  map<string,double> parameters = 12;
  map<string,double> capacities = 13;
  repeated StatePatch patches = 14;
  repeated Shock shocks = 15;
  repeated Intervention interventions = 16;
  string valid_from = 17;
  string valid_to = 18;
}

message ScenarioState {
  map<string,double> capacities = 1;
  string attributes_json = 2;
  map<string,double> transmission_reductions = 3;
  repeated string active_shock_ids = 4;
  repeated string applied_intervention_ids = 5;
  repeated string lineage = 6;
  string world_digest = 7;
  string evaluated_at = 8;
}

message ScenarioRun {
  string run_id = 1;
  string scenario_id = 2;
  string base_digest = 3;
  string result_digest = 4;
  repeated string applied_shock_ids = 5;
  repeated string applied_intervention_ids = 6;
  repeated string warnings = 7;
  string epistemic_status = 8;
}
