syntax = "proto3";

package qedty.core.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "dev.qedty.core.v1";
option go_package = "github.com/IRIN-0/qedty/gen/proto/qedty/core/v1;corev1";

// Wire contract only: the semantic model is defined by the Python reference
// implementation plus the JSON Schema and golden vectors in this package.
message EntityRef {
  string entity_id = 1;
}

message RelationshipRef {
  string relationship_id = 1;
}

message EventRef {
  string event_id = 1;
}

message EvidenceRef {
  string evidence_id = 1;
}

message TimeWindow {
  // Current QEDTY Core semantics are UTC-normalized instants. Explicit
  // TAI/TT/UT1 transformation belongs to a future time-scale contract.
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
}

message ExternalIdentifier {
  string namespace = 1;
  string value = 2;
}

message Quantity {
  string value_decimal = 1;
  string unit = 2;
  repeated int32 dimension = 3;
}

message ContractResult {
  google.protobuf.Value value = 1;
  string epistemic_state = 2;
  repeated string evidence_ids = 3;
  repeated string provenance_ids = 4;
  repeated string assumptions = 5;
  optional string model_id = 6;
  optional string model_version = 7;
  optional google.protobuf.Timestamp valid_at = 8;
  optional google.protobuf.Value uncertainty = 9;
  google.protobuf.Struct metadata = 10;
}

message RunResult {
  string run_id = 1;
  string status = 2;
  repeated string artifacts = 3;
  repeated string warnings = 4;
  repeated string errors = 5;
  optional google.protobuf.Timestamp started_at = 6;
  optional google.protobuf.Timestamp ended_at = 7;
  optional string software_version = 8;
  optional string model_version = 9;
  repeated string provenance_ids = 10;
  map<string, double> metrics = 11;
}
