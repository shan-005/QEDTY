syntax = "proto3";

package qedty.temporal.v1;

message TimestampRange {
  string start_rfc3339 = 1;
  string end_rfc3339 = 2;
  bool start_inclusive = 3;
  bool end_inclusive = 4;
}

message BitemporalExtent {
  TimestampRange valid_time = 1;
  TimestampRange transaction_time = 2;
}

message TemporalInstant {
  string at_rfc3339 = 1;
  string time_scale = 2;
  double uncertainty_seconds = 3;
}

message SnapshotSelector {
  TemporalInstant valid_at = 1;
  TemporalInstant transaction_at = 2;
}

message SnapshotMeta {
  string snapshot_id = 1;
  string captured_at_rfc3339 = 2;
  string world_digest = 3;
  string schema_version = 4;
  SnapshotSelector selector = 5;
}

message TemporalVersion {
  string version_id = 1;
  string record_key = 2;
  string value_json = 3;
  BitemporalExtent temporal = 4;
  repeated string supersedes = 5;
  string metadata_json = 6;
}
