syntax = "proto3";
package seraph.evidence.v1;

message SourceRef { string source_id = 1; }
message EntityRef { string entity_id = 1; }
message ProvenanceRef { string provenance_id = 1; }
message TimeWindow { string start_rfc3339 = 1; string end_rfc3339 = 2; }
message EvidenceSelector {
  string selector_type = 1;
  optional string value = 2;
  optional uint64 start = 3;
  optional uint64 end = 4;
  optional string unit = 5;
}
message AcquisitionReceipt {
  string acquisition_id = 1;
  string method = 2;
  string requested_uri = 3;
  string final_uri = 4;
  string retrieved_at_rfc3339 = 5;
  optional uint32 status_code = 6;
  optional string response_media_type = 7;
  uint64 response_size_bytes = 8;
  string content_sha256 = 9;
  optional string etag = 10;
  optional string last_modified = 11;
  repeated string redirect_chain = 12;
  map<string,string> response_headers = 13;
  string request_digest = 14;
}
message QualityMeasurement {
  string dimension = 1;
  string metric = 2;
  double value = 3;
  string method = 4;
  string measured_at = 5;
  string unit = 6;
}
message EvidenceRecord {
  string evidence_id = 1;
  SourceRef source = 2;
  string source_uri = 3;
  string title = 4;
  string kind = 5;
  string status = 6;
  string epistemic_status = 7;
  string content_sha256 = 8;
  string content_type = 9;
  uint64 content_length_bytes = 10;
  string encoding = 11;
  string retrieved_at_rfc3339 = 12;
  optional string observed_at_rfc3339 = 13;
  TimeWindow valid_time = 14;
  AcquisitionReceipt acquisition = 15;
  repeated QualityMeasurement quality = 16;
  repeated EntityRef about_entities = 17;
  repeated EvidenceSelector selectors = 18;
  repeated ProvenanceRef provenance = 19;
  string parser_name = 20;
  string parser_version = 21;
  string metadata_json = 22;
}
