syntax = "proto3";

package seraph.graph.v1;

// Canonical temporal representation is the frozen SERAPH UTC timestamp
// string used by the Python/Pydantic domain contracts. Validity intervals are
// interpreted as [valid_from, valid_to).
message EntityRef {
  string entity_id = 1;
}

message RelationshipRef {
  string relationship_id = 1;
  string source_entity_id = 2;
  string target_entity_id = 3;
  string relationship_type = 4;
  string valid_from_utc = 5;
  string valid_to_utc = 6;
  double strength = 7;
  double capacity_fraction = 8;
  string epistemic_status = 9;
}

message GraphPath {
  repeated string entity_ids = 1;
  repeated string relationship_ids = 2;
  double score = 3;
  double cost = 4;
  bool has_cost = 5;
}

message GraphSnapshot {
  string at_utc = 1;
  repeated string entity_ids = 2;
  repeated string relationship_ids = 3;
  string schema = 4;
}

message GraphEnvelope {
  string schema = 1;
  uint32 serialization_version = 2;
  repeated EntityRef entities = 3;
  repeated RelationshipRef relationships = 4;
  bytes digest_sha256 = 5;
}
